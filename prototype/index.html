<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
// ==== 00_util.js ====
// ───────────────────────── util ─────────────────────────
const TAU = Math.PI * 2;
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (t) => t * t * (3 - 2 * t);
const damp = (a, b, lambda, dt) => lerp(a, b, 1 - Math.exp(-lambda * dt));
function dampAngle(a, b, lambda, dt) {
  let d = ((b - a + Math.PI) % TAU + TAU) % TAU - Math.PI;
  return a + d * (1 - Math.exp(-lambda * dt));
}
function angDiff(a, b) { return ((b - a + Math.PI) % TAU + TAU) % TAU - Math.PI; }

// string → 32bit hash
function hashStr(str) {
  let h = 1779033703 ^ str.length;
  for (let i = 0; i < str.length; i++) {
    h = Math.imul(h ^ str.charCodeAt(i), 3432918353);
    h = (h << 13) | (h >>> 19);
  }
  h = Math.imul(h ^ (h >>> 16), 2246822507);
  h = Math.imul(h ^ (h >>> 13), 3266489909);
  return (h ^= h >>> 16) >>> 0;
}
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function makeRng(seed) {
  const r = mulberry32(typeof seed === 'string' ? hashStr(seed) : seed >>> 0);
  r.range = (a, b) => a + (b - a) * r();
  r.int = (a, b) => Math.floor(a + (b - a + 1) * r());
  r.pick = (arr) => arr[Math.floor(r() * arr.length)];
  r.chance = (p) => r() < p;
  r.weighted = (pairs) => { // [[item, w], ...]
    let s = 0; for (const p of pairs) s += p[1];
    let x = r() * s;
    for (const p of pairs) { x -= p[1]; if (x <= 0) return p[0]; }
    return pairs[pairs.length - 1][0];
  };
  r.gauss = () => { let u = 0, v = 0; while (!u) u = r(); while (!v) v = r(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(TAU * v); };
  return r;
}
const store = {
  get(k, d) { try { const v = localStorage.getItem('golmok:' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('golmok:' + k, JSON.stringify(v)); } catch (e) {} },
};
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
function h(tag, attrs = {}, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k === 'text') el.textContent = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? '' : v);
  }
  for (const kid of kids.flat()) if (kid != null && kid !== false) el.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  return el;
}
function josa(word, a, b) { // 받침 여부에 따라 조사 선택 (이/가, 은/는, 을/를)
  const c = word.charCodeAt(word.length - 1);
  if (c < 0xac00 || c > 0xd7a3) return word + b;
  return word + (((c - 0xac00) % 28) ? a : b);
}

// ==== 10_shaders.js ====
// ───────────────────────── shaders ─────────────────────────
// 모든 고양이가 공유하는 조명 uniform (scene 쪽에서 매 프레임 갱신)
const LIGHT = {
  sunDir: { value: new THREE.Vector3(0.4, 0.8, 0.3).normalize() },
  sunCol: { value: new THREE.Color(1.0, 0.95, 0.85) },
  skyCol: { value: new THREE.Color(0.55, 0.62, 0.75) },
  gndCol: { value: new THREE.Color(0.32, 0.28, 0.24) },
  lampPos: { value: new THREE.Vector3(0, 3, 0) },
  lampCol: { value: new THREE.Color(1.0, 0.7, 0.4) },
  lampOn: { value: 0 },
  fogCol: { value: new THREE.Color(0.7, 0.75, 0.8) },
  fogNear: { value: 8 },
  fogFar: { value: 30 },
  exposure: { value: 1.0 },
};

const NOISE_GLSL = /* glsl */`
vec3 mod289(vec3 x){return x-floor(x*(1.0/289.0))*289.0;}
vec4 mod289(vec4 x){return x-floor(x*(1.0/289.0))*289.0;}
vec4 permute(vec4 x){return mod289(((x*34.0)+1.0)*x);}
vec4 taylorInvSqrt(vec4 r){return 1.79284291400159-0.85373472095314*r;}
float snoise(vec3 v){
  const vec2 C=vec2(1.0/6.0,1.0/3.0); const vec4 D=vec4(0.0,0.5,1.0,2.0);
  vec3 i=floor(v+dot(v,C.yyy)); vec3 x0=v-i+dot(i,C.xxx);
  vec3 g=step(x0.yzx,x0.xyz); vec3 l=1.0-g; vec3 i1=min(g.xyz,l.zxy); vec3 i2=max(g.xyz,l.zxy);
  vec3 x1=x0-i1+C.xxx; vec3 x2=x0-i2+C.yyy; vec3 x3=x0-D.yyy;
  i=mod289(i);
  vec4 p=permute(permute(permute(i.z+vec4(0.0,i1.z,i2.z,1.0))+i.y+vec4(0.0,i1.y,i2.y,1.0))+i.x+vec4(0.0,i1.x,i2.x,1.0));
  float n_=0.142857142857; vec3 ns=n_*D.wyz-D.xzx;
  vec4 j=p-49.0*floor(p*ns.z*ns.z); vec4 x_=floor(j*ns.z); vec4 y_=floor(j-7.0*x_);
  vec4 x=x_*ns.x+ns.yyyy; vec4 y=y_*ns.x+ns.yyyy; vec4 h=1.0-abs(x)-abs(y);
  vec4 b0=vec4(x.xy,y.xy); vec4 b1=vec4(x.zw,y.zw);
  vec4 s0=floor(b0)*2.0+1.0; vec4 s1=floor(b1)*2.0+1.0; vec4 sh=-step(h,vec4(0.0));
  vec4 a0=b0.xzyw+s0.xzyw*sh.xxyy; vec4 a1=b1.xzyw+s1.xzyw*sh.zzww;
  vec3 p0=vec3(a0.xy,h.x); vec3 p1=vec3(a0.zw,h.y); vec3 p2=vec3(a1.xy,h.z); vec3 p3=vec3(a1.zw,h.w);
  vec4 norm=taylorInvSqrt(vec4(dot(p0,p0),dot(p1,p1),dot(p2,p2),dot(p3,p3)));
  p0*=norm.x;p1*=norm.y;p2*=norm.z;p3*=norm.w;
  vec4 m=max(0.6-vec4(dot(x0,x0),dot(x1,x1),dot(x2,x2),dot(x3,x3)),0.0); m=m*m;
  return 42.0*dot(m*m,vec4(dot(p0,x0),dot(p1,x1),dot(p2,x2),dot(p3,x3)));
}
float hash31(vec3 p){ p=fract(p*vec3(443.897,441.423,437.195)); p+=dot(p,p.yzx+19.19); return fract((p.x+p.y)*p.z); }
`;

const LIGHT_GLSL = /* glsl */`
uniform vec3 sunDir; uniform vec3 sunCol; uniform vec3 skyCol; uniform vec3 gndCol;
uniform vec3 lampPos; uniform vec3 lampCol; uniform float lampOn;
uniform vec3 fogCol; uniform float fogNear; uniform float fogFar; uniform float exposure;
vec3 applyFog(vec3 col, vec3 wp){
  float d = length(wp - cameraPosition);
  float f = smoothstep(fogNear, fogFar, d);
  return mix(col, fogCol, f);
}
`;

const FUR_VERT = /* glsl */`
#define MAXB 24
attribute float shell;
attribute float part;
attribute float fur;
attribute vec3 rest;
attribute vec3 restN;
attribute vec3 comb;
attribute float wpot;
attribute vec2 tcoord;
uniform mat4 bones[MAXB];
uniform float shellCount;
uniform float furLen;
uniform float furPuff;
uniform float breath;
varying vec3 vRest; varying vec3 vRestN; varying vec3 vN; varying vec3 vWP; varying vec3 vComb;
varying float vH; varying float vFur; varying float vW; varying vec2 vT;
void main(){
  mat4 B = bones[int(part + 0.5)];
  vec3 p = (B * vec4(position, 1.0)).xyz;
  vec3 n = normalize(mat3(B) * normal);
  vec3 c = mat3(B) * comb;
  float hh = shell / shellCount;
  float L = furLen * fur * (1.0 + furPuff * 0.85);
  vec3 dir = normalize(n + c * (1.0 - 0.8 * furPuff));
  p += dir * (hh * L);
  p.y -= hh * hh * L * 0.35 * (1.0 - furPuff);
  vec4 wp = modelMatrix * vec4(p, 1.0);
  vWP = wp.xyz;
  vN = normalize(mat3(modelMatrix) * n);
  vComb = normalize(mat3(modelMatrix) * (c + n * 0.15));
  vRest = rest; vRestN = restN; vH = hh; vFur = fur; vW = wpot; vT = tcoord;
  gl_Position = projectionMatrix * viewMatrix * wp;
}
`;

const FUR_FRAG = /* glsl */`
uniform vec3 colBase; uniform vec3 colStripe; uniform vec3 colPatch; uniform vec3 colWhite; uniform vec3 colSkin;
uniform float stripeAmt; uniform float stripeFreq; uniform float patchAmt; uniform float patchScale;
uniform float mottle; uniform float whiteAmt; uniform float whiteNoise; uniform float seed;
uniform float density; uniform float tipLight; uniform float highlight; uniform float shellCount;
varying vec3 vRest; varying vec3 vRestN; varying vec3 vN; varying vec3 vWP; varying vec3 vComb;
varying float vH; varying float vFur; varying float vW; varying vec2 vT;
${NOISE_GLSL}
${LIGHT_GLSL}
vec3 pattern(vec3 p){
  float nz = snoise(p * 9.0 + seed);
  float s = sin(vT.x * stripeFreq + nz * 1.9 + snoise(p * 3.0 + seed * 2.0) * 1.2);
  float stripe = smoothstep(-0.1, 0.85, s) * vT.y * stripeAmt * 0.85;
  vec3 col = mix(colBase, colStripe, stripe);
  if (patchAmt > 0.0) {
    float pn = snoise(p * patchScale + seed * 3.1) + 0.45 * snoise(p * patchScale * 2.7 + seed * 1.3);
    float pm = smoothstep(-0.06, 0.06, pn - (1.0 - 2.0 * patchAmt));
    col = mix(col, colPatch, pm);
  }
  if (mottle > 0.0) {
    float mn = snoise(p * 26.0 + seed * 5.0) + 0.6 * snoise(p * 7.0 + seed);
    col = mix(col, colPatch, smoothstep(0.1, 0.5, mn) * mottle);
  }
  col = mix(col, col * 1.22 + 0.07, smoothstep(0.45, 0.95, vW) * 0.55); // 배·주둥이 쪽은 자연스럽게 밝게
  float wn = vW + (snoise(p * 4.0 + seed * 7.0) * whiteNoise) + snoise(p * 22.0 + seed) * 0.05;
  float white = smoothstep(-0.035, 0.035, wn - (1.0 - whiteAmt));
  return mix(col, colWhite, white);
}
void main(){
  float hgt = vH;
  vec3 n0 = normalize(vRestN);
  // ── strand mask ──
  float alpha = 1.0;
  if (hgt > 0.0) {
    vec3 sp = vRest * density;
    vec3 cell = floor(sp);
    vec3 f = fract(sp) - 0.5;
    vec3 fp = f - dot(f, n0) * n0;
    float d = length(fp) * 2.0;
    float r = hash31(cell + seed * 0.37);
    float len = mix(0.72, 1.0, r);
    float t = hgt / len;
    float rad = 0.95 * pow(max(1.0 - t, 0.0), 0.75);
    float fw = max(fwidth(d), 0.02);
    float a1 = (t >= 1.0) ? 0.0 : clamp((rad - d) / fw + 0.5, 0.0, 1.0) * (1.0 - 0.55 * smoothstep(0.35, 1.0, t));
    // 솜털(언더코트): 더 촘촘한 격자, 아래쪽만
    vec3 sp2 = vRest * density * 1.6;
    vec3 f2 = fract(sp2) - 0.5; vec3 fp2 = f2 - dot(f2, n0) * n0;
    float d2 = length(fp2) * 2.0;
    float t2 = hgt / 0.38;
    float rad2 = 0.92 * (1.0 - t2);
    float fw2 = max(fwidth(d2), 0.02);
    float a2 = (t2 >= 1.0) ? 0.0 : clamp((rad2 - d2) / fw2 + 0.5, 0.0, 1.0);
    alpha = max(a1, a2);
    float ign = fract(52.9829189 * fract(dot(gl_FragCoord.xy + vec2(hgt * 97.0, hgt * 31.0), vec2(0.06711056, 0.00583715))));
    if (alpha < max(ign, 0.02)) discard;
  }
  // ── color ──
  vec3 col = pattern(vRest);
  float strandVar = hash31(floor(vRest * density) + 3.7);
  col *= 0.96 + 0.08 * strandVar;
  col = mix(col, col * 1.04 + 0.01, smoothstep(0.7, 1.0, hgt) * tipLight);
  float occ = mix(0.9, 1.0, hgt);
  // ── light ──
  vec3 N = normalize(vN);
  vec3 V = normalize(cameraPosition - vWP);
  float ndl = dot(N, sunDir);
  float diff = clamp((ndl + 0.75) / 1.75, 0.0, 1.0);
  vec3 amb = mix(gndCol, skyCol, N.y * 0.5 + 0.5);
  vec3 light = sunCol * diff + amb;
  // lamp
  vec3 Lp = lampPos - vWP; float ld = length(Lp); Lp /= ld;
  float lamp = lampOn * clamp((dot(N, Lp) + 0.5) / 1.5, 0.0, 1.0) / (1.0 + ld * ld * 0.12);
  light += lampCol * lamp;
  // Kajiya-Kay 하이라이트 (털결 방향)
  vec3 T = normalize(vComb);
  vec3 Hh = normalize(sunDir + V);
  float th = dot(T, Hh);
  float spec = pow(sqrt(max(1.0 - th * th, 0.0)), 64.0) * highlight * hgt * 0.6;
  // 림 라이트 (솜털 역광)
  float rim = pow(1.0 - max(dot(N, V), 0.0), 3.0) * hgt * 0.7;
  vec3 c = col * light * occ + sunCol * spec * 0.18 + (sunCol * 0.2 + amb * 0.1) * rim * col * 1.2;
  c *= exposure;
  c = applyFog(c, vWP);
  gl_FragColor = vec4(c, 1.0);
  #include <colorspace_fragment>
}
`;

function makeFurMaterial(genomeColors, shellCount) {
  const u = {
    ...LIGHT,
    bones: { value: Array.from({ length: 24 }, () => new THREE.Matrix4()) },
    shellCount: { value: shellCount },
    furLen: { value: 0.03 },
    furPuff: { value: 0 },
    breath: { value: 0 },
    density: { value: 330 },
    tipLight: { value: 0.6 },
    highlight: { value: 0.5 },
    colBase: { value: new THREE.Color() },
    colStripe: { value: new THREE.Color() },
    colPatch: { value: new THREE.Color() },
    colWhite: { value: new THREE.Color() },
    colSkin: { value: new THREE.Color() },
    stripeAmt: { value: 0 }, stripeFreq: { value: 170 },
    patchAmt: { value: 0 }, patchScale: { value: 8 },
    mottle: { value: 0 }, whiteAmt: { value: 0 }, whiteNoise: { value: 0.15 },
    seed: { value: 0 },
  };
  const m = new THREE.ShaderMaterial({
    uniforms: u,
    vertexShader: FUR_VERT,
    fragmentShader: FUR_FRAG,
    side: THREE.FrontSide,
  });
  m.extensions = { derivatives: true };
  return m;
}

const EYE_VERT = /* glsl */`
varying vec3 vL; varying vec3 vN; varying vec3 vWP;
void main(){ vL = position; vN = normalize(normalMatrix * normal); vec4 wp = modelMatrix * vec4(position,1.0); vWP = wp.xyz; gl_Position = projectionMatrix * viewMatrix * wp; }
`;
const EYE_FRAG = /* glsl */`
uniform vec3 irisA; uniform vec3 irisB; uniform float pupil; uniform float seed;
varying vec3 vL; varying vec3 vN; varying vec3 vWP;
${NOISE_GLSL}
${LIGHT_GLSL}
void main(){
  vec3 d = normalize(vL);
  vec2 q = d.xy;
  float r = length(q);
  float ang = atan(q.y, q.x);
  float streak = snoise(vec3(ang * 4.0, r * 6.0, seed)) * 0.5 + 0.5;
  vec3 iris = mix(irisA, irisB, smoothstep(0.15, 0.85, r));
  iris *= 0.85 + 0.3 * streak;
  iris = mix(iris, iris * 0.35, smoothstep(0.72, 0.95, r)); // 테두리
  float pw = mix(0.12, 0.42, pupil); float ph = mix(0.6, 0.5, pupil);
  float pe = (q.x * q.x) / (pw * pw) + (q.y * q.y) / (ph * ph);
  float pm = 1.0 - smoothstep(0.85, 1.05, pe);
  vec3 col = mix(iris, vec3(0.015, 0.012, 0.02), pm);
  col *= mix(1.0, 0.5, smoothstep(0.3, 0.85, q.y)); // 윗눈꺼풀 그늘
  if (d.z < 0.25) col = vec3(0.03, 0.025, 0.03);
  vec3 amb = mix(gndCol, skyCol, 0.6);
  vec3 c = col * (amb * 0.9 + sunCol * 0.45 + lampCol * lampOn * 0.25);
  // 캐치라이트
  float hl = 1.0 - smoothstep(0.08, 0.13, length(q - vec2(-0.26, 0.3)));
  float hl2 = 1.0 - smoothstep(0.03, 0.06, length(q - vec2(0.22, -0.2)));
  c += vec3(1.0) * (hl * 0.95 + hl2 * 0.6) * step(0.3, d.z);
  vec3 V = normalize(cameraPosition - vWP);
  float fres = pow(1.0 - max(dot(normalize(vN), normalize((viewMatrix * vec4(V,0.0)).xyz)), 0.0), 3.0);
  c += fres * 0.12;
  c *= exposure;
  c = applyFog(c, vWP);
  gl_FragColor = vec4(c, 1.0);
  #include <colorspace_fragment>
}
`;
function makeEyeMaterial(irisA, irisB, seed) {
  return new THREE.ShaderMaterial({
    uniforms: { ...LIGHT, irisA: { value: new THREE.Color(irisA) }, irisB: { value: new THREE.Color(irisB) }, pupil: { value: 0.3 }, seed: { value: seed } },
    vertexShader: EYE_VERT, fragmentShader: EYE_FRAG,
  });
}

// 털 없는 부위(코, 귓속, 입) 용 간단한 셰이더
const SKIN_FRAG = /* glsl */`
uniform vec3 col; uniform float gloss;
varying vec3 vL; varying vec3 vN; varying vec3 vWP;
${LIGHT_GLSL}
void main(){
  vec3 N = normalize(vN);
  vec3 amb = mix(gndCol, skyCol, 0.6);
  vec3 c = col * (amb + sunCol * 0.55 + lampCol * lampOn * 0.3);
  c += gloss * 0.25 * pow(max(N.z, 0.0), 12.0);
  c *= exposure;
  c = applyFog(c, vWP);
  gl_FragColor = vec4(c, 1.0);
  #include <colorspace_fragment>
}
`;
function makeSkinMaterial(color, gloss = 0) {
  return new THREE.ShaderMaterial({
    uniforms: { ...LIGHT, col: { value: new THREE.Color(color) }, gloss: { value: gloss } },
    vertexShader: EYE_VERT, fragmentShader: SKIN_FRAG,
  });
}

// ==== 20_catmodel.js ====
// ───────────────────────── cat model (rig + merged fur geometry) ─────────────────────────
const PART = { hips: 0, chest: 1, neck: 2, head: 3, earL: 4, earR: 5, shL: 6, elL: 7, shR: 8, elR: 9, hipL: 10, knL: 11, hipR: 12, knR: 13, t0: 14 };
const TAIL_SEGS = 8;

// 표준(서 있는) 자세
function standPose(dim) {
  return {
    h: dim.H, hp: 0, hr: 0, hy: 0, cp: 0, cy: 0, cr: 0, np: -0.05, ny: 0, hdp: 0.05, hdy: 0, hdr: 0,
    eL: 0, eR: 0, fls: 0, fle: 0, frs: 0, fre: 0, fsp: 0,
    hls: -0.28, hlk: 0.5, hrs: -0.28, hrk: 0.5, hsp: 0,
    tb: 0.55, tc: 0.12, ts: 0, tcs: 0, tw: 0.12, twf: 1.0,
    eye: 1, pupil: 0.55, mouth: 0, puff: 0, lift: 0,
  };
}

function catDims(g) {
  const gr = g.growth; // 0 아기 → 1 성체
  const s = lerp(0.42, 1.0, Math.pow(gr, 0.8));
  const head = lerp(1.3, 1.0, gr) * g.body.headSize * 1.34;
  const leg = lerp(0.78, 1.0, gr) * g.body.legLen;
  const chub = g.body.chub * lerp(1.06, 1.0, gr);
  return {
    scale: s, head, leg, chub,
    ear: lerp(1.12, 1.0, gr) * g.body.earSize,
    tail: lerp(0.5, 1.0, gr) * g.body.tailLen,
    eye: lerp(1.2, 1.0, gr),
    face: g.body.faceWidth,
    fluff: lerp(1.3, 1.0, gr),
    H: 0.196 * leg + 0.024,
    lu: 0.092 * leg, ll: 0.086 * leg, hu: 0.085 * leg, hl: 0.104 * leg,
    seg: 0.034 * lerp(0.5, 1.0, gr) * g.body.tailLen / Math.max(0.5, lerp(0.5, 1.0, gr)),
  };
}

function buildRig(dim) {
  const n = {};
  const mk = (name, parent, x, y, z) => { const o = new THREE.Object3D(); o.name = name; o.position.set(x, y, z); (parent || n.root).add(o); n[name] = o; return o; };
  n.root = new THREE.Object3D();
  mk('hips', null, 0, dim.H, -0.055);
  mk('chest', n.hips, 0, 0.006, 0.078);
  mk('neck', n.chest, 0, 0.04, 0.112);
  mk('head', n.neck, 0, 0.036, 0.046);
  n.head.scale.setScalar(dim.head);
  mk('earL', n.head, 0.044 * dim.face, 0.044, -0.01);
  mk('earR', n.head, -0.044 * dim.face, 0.044, -0.01);
  mk('shL', n.chest, 0.05 * dim.chub, -0.035, 0.065);
  mk('elL', n.shL, 0, -dim.lu, 0);
  mk('shR', n.chest, -0.05 * dim.chub, -0.035, 0.065);
  mk('elR', n.shR, 0, -dim.lu, 0);
  mk('hipL', n.hips, 0.048 * dim.chub, -0.025, -0.06);
  mk('knL', n.hipL, 0, -dim.hu, 0.03);
  mk('hipR', n.hips, -0.048 * dim.chub, -0.025, -0.06);
  mk('knR', n.hipR, 0, -dim.hu, 0.03);
  let prev = n.hips;
  for (let i = 0; i < TAIL_SEGS; i++) { mk('t' + i, prev, 0, i === 0 ? 0.04 : 0, i === 0 ? -0.15 : -dim.seg); prev = n['t' + i]; }
  n.list = ['hips', 'chest', 'neck', 'head', 'earL', 'earR', 'shL', 'elL', 'shR', 'elR', 'hipL', 'knL', 'hipR', 'knR', ...Array.from({ length: TAIL_SEGS }, (_, i) => 't' + i)].map((k) => n[k]);
  return n;
}

function applyPose(n, P, dim, t) {
  n.root.position.y = P.lift;
  n.hips.position.y = P.h;
  n.hips.rotation.set(P.hp, P.hy, P.hr, 'YXZ');
  n.chest.rotation.set(P.cp, P.cy, P.cr, 'YXZ');
  n.neck.rotation.set(P.np, P.ny * 0.4, 0, 'YXZ');
  n.head.rotation.set(P.hdp, P.hdy + P.ny * 0.6, P.hdr, 'YXZ');
  // 귀: 0=쫑긋, 1=납작(마징가 귀)
  n.earL.rotation.set(-0.12 - P.eL * 0.9, 0.25 + P.eL * 0.5, -0.32 - P.eL * 0.7, 'YXZ');
  n.earR.rotation.set(-0.12 - P.eR * 0.9, -0.25 - P.eR * 0.5, 0.32 + P.eR * 0.7, 'YXZ');
  n.shL.rotation.set(P.fls, 0, -P.fsp, 'XYZ'); n.elL.rotation.set(P.fle, 0, 0);
  n.shR.rotation.set(P.frs, 0, P.fsp, 'XYZ'); n.elR.rotation.set(P.fre, 0, 0);
  n.hipL.rotation.set(P.hls, 0, -P.hsp, 'XYZ'); n.knL.rotation.set(P.hlk, 0, 0);
  n.hipR.rotation.set(P.hrs, 0, P.hsp, 'XYZ'); n.knR.rotation.set(P.hrk, 0, 0);
  for (let i = 0; i < TAIL_SEGS; i++) {
    const k = i / (TAIL_SEGS - 1);
    const wave = Math.sin(t * P.twf * TAU - i * 0.55) * P.tw * (0.3 + k);
    const o = n['t' + i];
    if (i === 0) o.rotation.set(P.tb, P.ts + wave * 0.5, 0, 'YXZ');
    else o.rotation.set(P.tc, P.tcs + wave * 0.35, 0, 'YXZ');
  }
}

// ── 지오메트리 조각 ──
function ellipsoid(rx, ry, rz, ws, hs) { const big = Math.max(rx, ry, rz) > 0.03; ws = ws || (big ? 24 : 14); hs = hs || (big ? 16 : 10); const g = new THREE.SphereGeometry(1, ws, hs); g.scale(rx, ry, rz); return g; }
function capsule(r, len, rs = 14) { return new THREE.CapsuleGeometry(r, len, 5, rs); }

const EAR_CUT = 0.3; // 중성화 표식: 왼쪽 귀 끝 30%를 수평으로 자른다
function buildCatGeometry(g, dim, rig) {
  // 서 있는 자세로 rest 행렬 계산
  applyPose(rig, standPose(dim), dim, 0);
  rig.root.updateMatrixWorld(true);
  const restM = rig.list.map((o) => o.matrixWorld.clone());
  const pieces = [];
  const add = (part, geo, mat, opt) => { if (mat) geo.applyMatrix4(mat); pieces.push({ part, geo, ...opt }); };
  const M = (x, y, z, rx = 0, ry = 0, rz = 0) => new THREE.Matrix4().compose(new THREE.Vector3(x, y, z), new THREE.Quaternion().setFromEuler(new THREE.Euler(rx, ry, rz)), new THREE.Vector3(1, 1, 1));
  const c = dim.chub, fl = g.furLen * dim.fluff;
  const tabbyBody = (p) => [p.z * 1.0, 1];

  // 몸통
  add(PART.hips, ellipsoid(0.084 * c, 0.092 * Math.sqrt(c), 0.13), M(0, 0.0, -0.02), { blend: { c: [0, 0, 0], axis: true, k: 0.55 },
    fur: () => 1.0 * fl, comb: () => [0, -0.5, -1.5], tab: (p, n) => [p.z, clamp(0.35 + n.y * 1.4, 0, 1)],
  });
  // 수컷 땅콩(고환): 꼬리 밑 엉덩이 뒤 아래에 작은 한 쌍. 4개월 전엔 없고 4~10개월에 0.4배에서 1배로 자란다. 암컷은 없다.
  if (g.sex === 'm' && g.months >= 4) {
    const nk = lerp(0.4, 1, clamp((g.months - 4) / 6, 0, 1)), sc = Math.sqrt(c);
    for (const sx of [1, -1]) add(PART.hips, ellipsoid(0.0155 * nk, 0.019 * nk, 0.0165 * nk, 14, 10), M(sx * 0.019, -0.052 * sc, -0.133), { fur: () => 0.45 * fl, comb: () => [0, -0.8, -0.3], tab: () => [0, 0], nut: true });
  }
  add(PART.chest, ellipsoid(0.086 * c, 0.096 * Math.sqrt(c), 0.115), M(0, -0.004, 0.025), { blend: { c: [0, -0.004, 0], axis: true, k: 0.55 },
    fur: (p, n) => (1.0 + clamp(-n.y, 0, 1) * 0.2 + clamp(n.z, 0, 1) * 0.15) * fl, comb: () => [0, -0.6, -1.4], tab: (p, n) => [p.z, clamp(0.35 + n.y * 1.4, 0, 1)],
  });
  // 목털(러프)
  add(PART.neck, ellipsoid(0.066 * c, 0.066, 0.062), M(0, -0.01, 0.0), {
    fur: (p, n) => (1.05 + clamp(n.z, 0, 1) * 0.25) * fl * (0.9 + g.fluff * 0.2), comb: () => [0, -1.0, -0.7], tab: (p) => [p.y * 1.3, 0.7],
  });
  // 머리
  const fw = dim.face;
  const eyeL = new THREE.Vector3(0.03 * fw, 0.004, 0.058), eyeR = new THREE.Vector3(-0.03 * fw, 0.004, 0.058);
  const headFur = (base) => (p, n) => {
    const de = Math.min(p.distanceTo(eyeL), p.distanceTo(eyeR));
    const front = clamp((n.z - 0.6) * 2.5, 0, 1);
    return base * fl * lerp(1, 0.75, front) * lerp(0.45, 1, smooth(clamp((de - 0.014) / 0.02, 0, 1)));
  };
  const headTab = (p, n) => {
    const top = clamp((n.y - 0.15) * 2.0, 0, 1) * clamp(n.z + 0.4, 0, 1);
    const side = clamp(Math.abs(n.x) - 0.6, 0, 1) * 1.2 * clamp(-n.z + 0.3, 0, 1);
    return [p.x * 1.6, clamp(top * 0.75 * clamp((n.z + 0.1) * 2.0, 0, 1) + side * 0.4, 0, 1)];
  };
  add(PART.head, ellipsoid(0.072 * fw, 0.066, 0.064), M(0, 0, 0), { blend: { c: [0, -0.008, 0], k: 0.8 }, fur: headFur(0.55), comb: (p, n) => [n.x * 0.4, 0.2, -1.2], tab: headTab, head: true });
  add(PART.head, ellipsoid(0.04, 0.034, 0.036), M(0.04 * fw, -0.02, 0.02), { blend: { c: [0, -0.008, 0], k: 0.8 }, fur: headFur(0.95 + g.fluff * 0.2), comb: () => [0.9, -0.8, -0.9], tab: headTab, head: true });
  add(PART.head, ellipsoid(0.04, 0.034, 0.036), M(-0.04 * fw, -0.02, 0.02), { blend: { c: [0, -0.008, 0], k: 0.8 }, fur: headFur(0.95 + g.fluff * 0.2), comb: () => [-0.9, -0.8, -0.9], tab: headTab, head: true });
  add(PART.head, ellipsoid(0.015, 0.012, 0.012), M(0.011, -0.018, 0.056), { blend: { c: [0, -0.008, 0], k: 0.65 }, fur: () => 0.3 * fl, comb: (p, n) => [n.x, -0.2, 0], tab: () => [0, 0], muzzle: true });
  add(PART.head, ellipsoid(0.015, 0.012, 0.012), M(-0.011, -0.018, 0.056), { blend: { c: [0, -0.008, 0], k: 0.65 }, fur: () => 0.3 * fl, comb: (p, n) => [n.x, -0.2, 0], tab: () => [0, 0], muzzle: true });
  add(PART.head, ellipsoid(0.012, 0.009, 0.01), M(0, -0.03, 0.048), { blend: { c: [0, -0.008, 0], k: 0.65 }, fur: () => 0.35 * fl, comb: () => [0, -0.6, 0], tab: () => [0, 0], muzzle: true });
  // 귀
  const earG = (cut) => { // cut: 끝을 수평으로 잘라 낸 비율(중성화 표식). 0이면 뾰족한 귀
    const e = cut ? new THREE.CylinderGeometry(0.028 * dim.ear * cut, 0.028 * dim.ear, 0.05 * dim.ear * (1 - cut), 18, 4) : new THREE.ConeGeometry(0.028 * dim.ear, 0.05 * dim.ear, 18, 4);
    if (cut) { e.translate(0, (-0.005 + 0.025 * (1 - cut)) * dim.ear, 0); } else e.translate(0, 0.02 * dim.ear, 0);
    e.scale(1, 1, 0.42); return e;
  };
  add(PART.earL, earG(g.tnr ? EAR_CUT : 0), null, { fur: (p, n) => 0.28 * fl * (n.z > 0.5 ? 0.3 : 1), comb: () => [0, 0.6, -0.2], tab: () => [0, 0], ear: true });
  add(PART.earR, earG(0), null, { fur: (p, n) => 0.28 * fl * (n.z > 0.5 ? 0.3 : 1), comb: () => [0, 0.6, -0.2], tab: () => [0, 0], ear: true });
  // 앞다리
  for (const [sh, el] of [[PART.shL, PART.elL], [PART.shR, PART.elR]]) {
    add(sh, capsule(0.027, dim.lu * 0.85), M(0, -dim.lu * 0.5, 0), { fur: () => 0.75 * fl, comb: () => [0, -0.8, -0.1], tab: (p) => [p.y * 1.2, 0.85], leg: true });
    add(el, capsule(0.021, dim.ll * 0.85), M(0, -dim.ll * 0.5, 0), { fur: () => 0.55 * fl, comb: () => [0, -0.8, 0], tab: (p) => [p.y * 1.2, 0.85], leg: true });
    add(el, ellipsoid(0.022, 0.014, 0.027), M(0, -dim.ll - 0.001, 0.008), { fur: () => 0.3 * fl, comb: () => [0, -0.3, 0.6], tab: () => [0, 0], paw: true });
  }
  // 뒷다리 (허벅지 + 정강이 + 발)
  for (const [hp, kn, sx] of [[PART.hipL, PART.knL, 1], [PART.hipR, PART.knR, -1]]) {
    add(hp, ellipsoid(0.044 * c, 0.07, 0.064), M(sx * 0.004, -0.03, 0.005), { fur: () => 0.9 * fl, comb: () => [0, -1.0, -0.9], tab: (p) => [p.y * 1.1, 0.9] });
    add(kn, capsule(0.02, dim.hl * 0.85), M(0, -dim.hl * 0.5, 0), { fur: () => 0.55 * fl, comb: () => [0, -0.7, -0.3], tab: (p) => [p.y * 1.2, 0.85], leg: true });
    add(kn, ellipsoid(0.021, 0.014, 0.03), M(0, -dim.hl - 0.002, 0.011), { fur: () => 0.38 * fl, comb: () => [0, -0.3, 0.6], tab: () => [0, 0], paw: true });
  }
  // 꼬리
  for (let i = 0; i < TAIL_SEGS; i++) {
    const k = i / (TAIL_SEGS - 1);
    const r = lerp(0.021, 0.015, k) * (i === TAIL_SEGS - 1 ? 0.9 : 1);
    add(PART.t0 + i, capsule(r, dim.seg * 0.9, 12), M(0, 0, -dim.seg * 0.5, Math.PI / 2, 0, 0), {
      fur: () => (1.2 + g.fluff * 0.3) * fl * (i === TAIL_SEGS - 1 ? 0.85 : 1), comb: () => [0, 0.05, -1.1], tab: (p) => [(i * dim.seg + (-p.z)) * 1.6, 1], tail: k,
    });
  }

  // ── 병합 + attribute 계산 ──
  let nv = 0, ni = 0;
  for (const pc of pieces) { nv += pc.geo.attributes.position.count; ni += pc.geo.index.count; }
  const pos = new Float32Array(nv * 3), nor = new Float32Array(nv * 3), rest = new Float32Array(nv * 3), restN = new Float32Array(nv * 3), comb = new Float32Array(nv * 3);
  const part = new Float32Array(nv), fur = new Float32Array(nv), wpot = new Float32Array(nv), tco = new Float32Array(nv * 2);
  const idx = new Uint32Array(ni);
  const P = new THREE.Vector3(), N = new THREE.Vector3(), R = new THREE.Vector3(), RN = new THREE.Vector3(), nm = new THREE.Matrix3();
  let vo = 0, io = 0;
  const hipsY = dim.H;
  for (const pc of pieces) {
    const gp = pc.geo.attributes.position, gn = pc.geo.attributes.normal, gi = pc.geo.index;
    const rm = restM[pc.part]; nm.getNormalMatrix(rm);
    for (let i = 0; i < gp.count; i++) {
      P.fromBufferAttribute(gp, i); N.fromBufferAttribute(gn, i).normalize();
      if (pc.blend) { const B = pc.blend; const dv = new THREE.Vector3(P.x - B.c[0], P.y - B.c[1], B.axis ? 0 : P.z - B.c[2]); if (dv.lengthSq() > 1e-10) N.lerp(dv.normalize(), B.k).normalize(); }
      R.copy(P).applyMatrix4(rm); RN.copy(N).applyMatrix3(nm).normalize();
      const o = vo + i;
      pos.set([P.x, P.y, P.z], o * 3); nor.set([N.x, N.y, N.z], o * 3);
      rest.set([R.x, R.y, R.z], o * 3); restN.set([RN.x, RN.y, RN.z], o * 3);
      part[o] = pc.part;
      fur[o] = pc.fur(P, N);
      const cb = pc.comb(P, N); comb.set(cb, o * 3);
      const tb = pc.tab(R, RN); tco[o * 2] = tb[0]; tco[o * 2 + 1] = tb[1];
      // 흰 털 잠재도: 배·가슴·턱·발이 높고 등·정수리가 낮음
      let w;
      if (pc.head) w = clamp(-RN.y * 0.9 + RN.z * 0.55 - 0.15 + (Math.abs(RN.x) < 0.35 && RN.z > 0.5 ? 0.25 - Math.abs(RN.x) * 0.5 : 0), 0, 1) * 0.92;
      else if (pc.muzzle) w = 0.97;
      else if (pc.ear) w = 0.02;
      else if (pc.paw) w = 0.99;
      else if (pc.nut) w = 0.12;
      else if (pc.leg) w = clamp(0.92 - (R.y / (hipsY * 0.75)) * 0.65, 0, 1) * (0.75 + 0.25 * clamp(RN.z, 0, 1));
      else if (pc.tail !== undefined) w = 0.05 + pc.tail * pc.tail * 0.35;
      else w = clamp(-RN.y * 0.85 + 0.42 + clamp(RN.z, 0, 1) * clamp(R.z - 0.02, 0, 0.2) * 3.0, 0, 1) * 0.97;
      wpot[o] = w;
    }
    for (let i = 0; i < gi.count; i++) idx[io + i] = gi.array[i] + vo;
    vo += gp.count; io += gi.count;
    pc.geo.dispose();
  }
  const base = new THREE.BufferGeometry();
  const geo = new THREE.InstancedBufferGeometry();
  geo.setIndex(new THREE.BufferAttribute(idx, 1));
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('normal', new THREE.BufferAttribute(nor, 3));
  geo.setAttribute('rest', new THREE.BufferAttribute(rest, 3));
  geo.setAttribute('restN', new THREE.BufferAttribute(restN, 3));
  geo.setAttribute('comb', new THREE.BufferAttribute(comb, 3));
  geo.setAttribute('part', new THREE.BufferAttribute(part, 1));
  geo.setAttribute('fur', new THREE.BufferAttribute(fur, 1));
  geo.setAttribute('wpot', new THREE.BufferAttribute(wpot, 1));
  geo.setAttribute('tcoord', new THREE.BufferAttribute(tco, 2));
  const MAXSH = 40;
  const sh = new Float32Array(MAXSH + 1); for (let i = 0; i <= MAXSH; i++) sh[i] = i;
  geo.setAttribute('shell', new THREE.InstancedBufferAttribute(sh, 1));
  base.dispose();
  return { geo, eyeL, eyeR };
}

// ── 고양이 한 마리 (3D) ──
class CatView {
  constructor(genome, shells) {
    this.g = genome;
    this.dim = catDims(genome);
    this.rig = buildRig(this.dim);
    const { geo, eyeL, eyeR } = buildCatGeometry(genome, this.dim, this.rig);
    this.sp = { pos: geo.attributes.position.array, part: geo.attributes.part.array }; // 바닥 검사용 피부 정점 (전부)
    this.minPart = new Float32Array(24);
    this.mat = makeFurMaterial(genome, shells);
    const u = this.mat.uniforms;
    const C = genome.colors;
    u.colBase.value.set(C.base); u.colStripe.value.set(C.stripe); u.colPatch.value.set(C.patch); u.colWhite.value.set(C.white);
    u.stripeAmt.value = genome.stripeAmt; u.stripeFreq.value = genome.stripeFreq;
    u.patchAmt.value = genome.patchAmt; u.patchScale.value = genome.patchScale; u.mottle.value = genome.mottle;
    u.whiteAmt.value = genome.whiteAmt; u.whiteNoise.value = genome.whiteNoise; u.seed.value = genome.seedF;
    u.furLen.value = 0.026; u.tipLight.value = genome.tipLight;
    u.density.value = 620 / Math.sqrt(this.dim.scale);
    this.mesh = new THREE.Mesh(geo, this.mat);
    this.mesh.frustumCulled = false;
    this.setShells(shells);
    this.root = new THREE.Group();
    this.root.add(this.rig.root);
    this.rig.root.add(this.mesh);
    this.rig.root.scale.setScalar(this.dim.scale);
    // 눈
    const er = 0.0192 * this.dim.eye;
    const eyeGeo = new THREE.SphereGeometry(er, 24, 16);
    this.eyeMat = makeEyeMaterial(genome.eye[0], genome.eye[1], genome.seedF);
    this.eyeMatR = genome.eye[2] ? makeEyeMaterial(genome.eye[2], genome.eye[3], genome.seedF + 1) : this.eyeMat;
    this.eyes = [];
    for (const [p, s, m] of [[eyeL, 1, this.eyeMat], [eyeR, -1, this.eyeMatR]]) {
      const e = new THREE.Mesh(eyeGeo, m);
      const ep = p.clone(); ep.z -= er * 0.42 - 0.002; ep.y += 0.002 * (this.dim.eye - 1);
      e.position.copy(ep); e.rotation.set(-0.02, s * 0.2, 0);
      e.scale.set(1.0, 0.94, 0.6);
      this.rig.head.add(e); this.eyes.push(e);
    }
    // 코
    const nose = new THREE.Mesh(new THREE.SphereGeometry(0.0068, 14, 10), makeSkinMaterial(genome.nose, 0.6));
    nose.scale.set(1.15, 0.72, 0.75); nose.position.set(0, -0.005, 0.0695);
    this.rig.head.add(nose); this.nose = nose;
    // 입 (하품·하악질 때만 보임)
    this.mouth = new THREE.Mesh(new THREE.SphereGeometry(0.014, 14, 10), makeSkinMaterial('#5a1f26', 0.2));
    this.mouth.position.set(0, -0.028, 0.06); this.mouth.scale.set(1, 0.05, 0.7);
    this.rig.head.add(this.mouth);
    // 귓속
    const inner = makeSkinMaterial(genome.earInner, 0.1);
    for (const en of [this.rig.earL, this.rig.earR]) {
      const D = this.dim.ear, cutE = genome.tnr && en === this.rig.earL; // 잘린 귀는 귓속도 같은 높이에서 끝난다
      const ig = cutE ? new THREE.CylinderGeometry(0.0057 * D, 0.021 * D, 0.0315 * D, 14, 1, true, -Math.PI / 2, Math.PI) : new THREE.ConeGeometry(0.021 * D, 0.044 * D, 14, 1, true, -Math.PI / 2, Math.PI);
      ig.translate(0, cutE ? 0.01375 * D : 0.02 * D, 0); ig.scale(1, 1, 0.4);
      const im = new THREE.Mesh(ig, inner); im.position.z = 0.0062;
      en.add(im);
    }
    // 수염
    const wpts = [];
    for (const s of [1, -1]) for (let k = 0; k < 3; k++) {
      const y0 = -0.017 - k * 0.0045, x0 = s * 0.018;
      wpts.push(x0, y0, 0.07, s * 0.085, y0 + 0.012 - k * 0.014, 0.05 - k * 0.006);
    }
    const wg = new THREE.BufferGeometry(); wg.setAttribute('position', new THREE.Float32BufferAttribute(wpts, 3));
    this.whiskers = new THREE.LineSegments(wg, new THREE.LineBasicMaterial({ color: 0xf4f0ea, transparent: true, opacity: 0.75 }));
    this.rig.head.add(this.whiskers);
    // 그림자 (blob)
    this.shadow = new THREE.Mesh(SHADOW_GEO, SHADOW_MAT);
    this.shadow.rotation.x = -Math.PI / 2; this.shadow.position.y = 0.004;
    this.shadow.scale.set(0.5 * this.dim.scale, 0.75 * this.dim.scale, 1);
    this.root.add(this.shadow);
    this.pose = standPose(this.dim);
    this.tmp = new THREE.Matrix4();
    this.inv = new THREE.Matrix4();
  }
  setShells(n) {
    this.mesh.geometry.instanceCount = n + 1;
    this.mat.uniforms.shellCount.value = n;
  }
  pawY(node, len, dz) {
    const v = this._pv || (this._pv = new THREE.Vector3());
    v.set(0, -len - 0.013, dz).applyMatrix4(node.matrixWorld).applyMatrix4(this.inv);
    return v.y;
  }
  // 현재 뼈대 자세에서 피부 정점의 가장 낮은 y (몸 좌표, 바닥 보정 전). 부위별 최저는 this.minPart
  lowest() {
    const B = this.mat.uniforms.bones.value, L = this.rig.list, mp = this.minPart;
    for (let i = 0; i < L.length; i++) { B[i].multiplyMatrices(this.inv, L[i].matrixWorld); mp[i] = 9; }
    const { pos, part } = this.sp;
    for (let i = 0, n = part.length; i < n; i++) {
      const e = B[part[i]].elements, y = e[1] * pos[i * 3] + e[5] * pos[i * 3 + 1] + e[9] * pos[i * 3 + 2] + e[13];
      if (y < mp[part[i]]) mp[part[i]] = y;
    }
    let m = 9; for (let i = 0; i < L.length; i++) if (mp[i] < m) m = mp[i];
    return m;
  }
  // 앉기: 엉덩이를 깔고 앉도록 몸통 기울기(hp)를 체형마다 맞춘다. 앞발이 바닥에 닿은 채 엉덩이 아래가 바닥을 뚫지 않는 가장 큰 기울기를 이분법으로 찾는다.
  solveSit(P, t) {
    const Q = this._Q || (this._Q = {}); Object.assign(Q, P);
    const R = this.rig, d = this.dim;
    const g = (hp) => {
      Q.hp = hp; Q.cp = P.cp - (hp - P.hp); // 가슴 이하는 세운 채로 두고 엉덩이만 눕힌다
      applyPose(R, Q, d, t); this.root.updateMatrixWorld(true); this.lowest();
      const f = Math.min(this.pawY(R.elL, d.ll, 0.008), this.pawY(R.elR, d.ll, 0.008));
      return this.minPart[0] - f; // 앞발을 바닥에 맞춘 뒤 엉덩이 최저 높이
    };
    let hp = P.hp;
    if (g(hp) < 0) { let lo = hp, hi = 0.2; for (let i = 0; i < 9; i++) { const mid = (lo + hi) / 2; if (g(mid) < 0) lo = mid; else hi = mid; } hp = hi; }
    Q.hp = hp; Q.cp = P.cp - (hp - P.hp); applyPose(R, Q, d, t); this.root.updateMatrixWorld(true);
  }
  update(t, dt) {
    const P = this.pose;
    applyPose(this.rig, P, this.dim, t);
    this.root.updateMatrixWorld(true);
    this.inv.copy(this.rig.root.matrixWorld).invert();
    const mode = this.plant || 'all';
    if (mode === 'sit' && this.ground !== false) this.solveSit(P, t);
    let shift = 0, low = 0;
    const net = this.ground !== false; // 바닥 안전망 (시험에서 false로 끄고 전후 비교)
    if (net) low = this.lowest(); // 현재 자세에서 가장 낮은 피부 정점 (몸 기준 y)
    if (mode !== 'none') {
      const d = this.dim, R = this.rig;
      const f = Math.min(this.pawY(R.elL, d.ll, 0.008), this.pawY(R.elR, d.ll, 0.008));
      const hnd = Math.min(this.pawY(R.knL, d.hl, 0.011), this.pawY(R.knR, d.hl, 0.011));
      shift = mode === 'front' || mode === 'sit' ? -f : mode === 'hind' ? -hnd : mode === 'min' ? -Math.min(f, hnd) : -(f + hnd) / 2;
    } else if (net) shift = -GROUND_SINK - low; // 눕는 자세는 높이 상수 대신 가장 낮은 곳이 바닥에 닿게
    this.hOff = dt ? damp(this.hOff || 0, shift, 14, dt) : shift;
    // 안전망: 머리·귀·가슴·엉덩이·발·꼬리 어디도 바닥 아래로 내려가지 않게 올린다
    const extra = net ? Math.max(0, -GROUND_SINK - (low + this.hOff)) : 0;
    this.hFinal = this.hOff + extra;
    if (Math.abs(this.hFinal) > 1e-5) { R_shift(this.rig, this.hFinal); this.root.updateMatrixWorld(true); }
    const B = this.mat.uniforms.bones.value;
    for (let i = 0; i < this.rig.list.length; i++) B[i].multiplyMatrices(this.inv, this.rig.list[i].matrixWorld);
    this.mat.uniforms.furPuff.value = P.puff;
    const eo = clamp(P.eye, 0.04, 1);
    for (const e of this.eyes) e.scale.y = 0.94 * eo;
    this.eyeMat.uniforms.pupil.value = P.pupil; this.eyeMatR.uniforms.pupil.value = P.pupil;
    this.mouth.scale.y = 0.05 + P.mouth * 0.75;
    this.mouth.position.y = -0.028 - P.mouth * 0.006;
    // 그림자: 몸통 아래 + 높이에 따라 옅게
    this.rig.hips.getWorldPosition(this._v || (this._v = new THREE.Vector3()));
    this.root.worldToLocal(this._v);
    this.shadow.position.x = this._v.x * 0.6; this.shadow.position.z = this._v.z * 0.7 + 0.02 * this.dim.scale;
    const lift = P.lift;
    this.shadow.material.opacity = 0.55;
    const ss = this.dim.scale * (1 + Math.abs(P.hr) * 0.35) / (1 + lift * 4);
    this.shadow.scale.set(0.55 * ss, 0.95 * ss, 1);
  }
  dispose() {
    this.mesh.geometry.dispose(); this.mat.dispose(); this.eyeMat.dispose();
    this.root.traverse((o) => { if (o.geometry && o.geometry !== SHADOW_GEO) o.geometry.dispose(); });
  }
}

const GROUND_SINK = 0.005; // 털이 눌리는 정도: 피부가 이만큼까지는 바닥에 파묻혀도 된다
function R_shift(rig, dy) { rig.hips.position.y += dy; }
const SHADOW_GEO = new THREE.CircleGeometry(0.5, 32);
const SHADOW_MAT = (() => {

];
const DAY = 86400000;
const EPOCH = Date.UTC(2026, 8, 1, -9); // 2026-09-01 00:00 KST
const TIME_SCALE = 7; // 서비스 시간 = 실제의 7배

function stageOf(months) {
  if (months < 2) return { key: 'baby', label: '아기' };
  if (months < 6) return { key: 'kit', label: '꼬마' };
  if (months < 12) return { key: 'teen', label: '청소년' };
  return { key: 'adult', label: '성체' };
}
function ageText(months) {
  if (months < 1) return Math.max(1, Math.round(months * 4.3)) + '주';
  if (months < 12) return Math.floor(months) + '개월';
  const y = Math.floor(months / 12);
  return y + '살';
}

function makePersonality(r, kitten) {
  const p = {};
  for (const [k] of TRAITS) p[k] = clamp(0.5 + r.gauss() * 0.22, 0.02, 0.98);
  if (kitten) { p.playful = clamp(p.playful + 0.3, 0, 1); p.energy = clamp(p.energy + 0.25, 0, 1); p.grumpy = clamp(p.grumpy - 0.25, 0, 1); }
  return p;
}
function traitTags(p) {
  const arr = TRAITS.map(([k, hi, lo]) => ({ k, d: p[k] - 0.5, hi, lo })).sort((a, b) => Math.abs(b.d) - Math.abs(a.d));
  return arr.slice(0, 2).map((t) => (t.d > 0 ? t.hi : t.lo));
}

const TNR_MIN_MONTHS = 6; // 중성화 표시는 6개월 이상부터
function makeGenome(r, opts) {
  const { sex, months, mother } = opts;
  let pk;
  if (mother && r.chance(0.6)) pk = mother.pattern;
  else pk = r.weighted(Object.entries(PATTERNS).filter(([k, v]) => !(v.female && sex === 'm')).map(([k, v]) => [k, v.w]));
  if (PATTERNS[pk].female && sex === 'm') pk = 'mackerel';
  const P = PATTERNS[pk];
  const growth = Math.pow(clamp((months - 0.8) / 11, 0, 1), 0.7);
  const base = r.pick(P.base);
  let eyeKey = r.weighted([['amber', 30], ['yellow', 26], ['green', 22], ['hazel', 16], ['blue', pk === 'white' ? 40 : 3]]);
  let eye = EYES[eyeKey].slice();
  if (pk === 'white' && r.chance(0.25)) { eye = EYES.blue.concat(EYES.amber); eyeKey = 'odd'; }
  if (months < 3.5) { // 아기 고양이는 파란 눈 → 점점 제 색
    const t = clamp((months - 1.5) / 2, 0, 1);
    const mix = (a, b) => '#' + new THREE.Color(a).lerp(new THREE.Color(b), t).getHexString();
    eye = [mix(EYES.kitten[0], eye[0]), mix(EYES.kitten[1], eye[1])];
  }
  const tnrRoll = r.chance(0.5);
  const whiteBase = P.white ?? (r.chance(0.12) ? 0.25 : 0);
  const g = {
    pattern: pk, patternLabel: P.label, sex, months, growth,
    colors: { base, stripe: P.stripe, patch: P.patch || '#1f1c1e', white: '#f3f0ea' },
    stripeAmt: P.stripeAmt, stripeFreq: r.range(150, 200),
    patchAmt: P.patchAmt || 0, patchScale: r.range(6, 10), mottle: P.mottle || 0,
    whiteAmt: whiteBase === 1 ? 1 : clamp(whiteBase + (whiteBase ? r.range(-0.08, 0.08) : 0), 0, 1),
    whiteNoise: P.wn ?? 0.15,
    eye, eyeKey,
    nose: P.nose, earInner: ['black', 'tuxedo', 'tortie'].includes(pk) ? '#8a6262' : '#e6a49b',
    furLen: r.range(0.78, 1.18), fluff: r.range(0.3, 1),
    tipLight: ['black', 'tuxedo', 'tortie', 'cow'].includes(pk) ? 0.12 : pk.startsWith('mackerel') || pk === 'gray' ? 0.3 : 0.5,
    body: { chub: r.range(0.92, 1.16), legLen: r.range(0.93, 1.06), headSize: r.range(0.95, 1.06), earSize: r.range(0.9, 1.12), tailLen: r.range(0.85, 1.1), faceWidth: r.range(0.94, 1.08) },
    tnr: months >= TNR_MIN_MONTHS && tnrRoll, // 성묘 약 50%, 수컷·암컷 모두. 월령과 상관없이 같은 값을 뽑아 새로고침·나이에 흔들리지 않는다
    personality: makePersonality(r, months < 6),
    seedF: r() * 100,
  };
  return g;
}

const sexText = (g) => (g.sex === 'f' ? '암컷' : '수컷') + (g.tnr ? '(중)' : ''); // (중) = 중성화
function nameFor(r, g, used) {
  const pool = g.months < 6 ? KITTEN_NAMES : PATTERNS[g.pattern].names.concat(ADULT_NAMES.slice(0, 4));
  let name = r.pick(pool);
  let tries = 0;
  while (used.has(name) && tries++ < 12) name = r.pick(g.months < 6 ? KITTEN_NAMES : PATTERNS[g.pattern].names.concat(ADULT_NAMES));
  if (used.has(name)) name = name + (2 + [...used].filter((u) => u.startsWith(name)).length);
  if (g.months >= 12 && g.body.chub > 1.12 && !name.startsWith('뚱') && r.chance(0.5)) name = '뚱' + name.replace(/이$/, '');
  used.add(name);
  return name;
}

// 활성 지역(현재 시/도) 하나에 마스코트 고양이 한 마리 (결정적: 같은 지역 코드 → 같은 고양이, 나이는 실제 시간에 따라 자람)
function dongPopulation(dong, now = Date.now()) {
  const r = makeRng('mascot:' + dong.c);
  const sex = r.chance(0.55) ? 'f' : 'm';
  const stage = r.weighted([['kit', 3], ['teen', 2], ['adult', 5]]);
  const ageAtEpoch = stage === 'kit' ? r.range(0.4, 3.5) : stage === 'teen' ? r.range(5, 10) : r.range(13, 72);
  const months = ageAtEpoch + ((now - EPOCH) / DAY) * TIME_SCALE / 30.4;
  const g = makeGenome(makeRng('mascotg:' + dong.c), { sex, months });
  const cat = { id: dong.c + '-m', idx: 0, dong: dong.c, g, name: '', born: EPOCH - (ageAtEpoch * 30.4 / TIME_SCALE) * DAY, mother: null, litter: null, here: true };
  cat.defaultName = nameFor(r, g, new Set());
  cat.name = cat.defaultName;
  return [cat];
}

const REGIONS_RAW = await (async () => {
  try {
    const res = await fetch('./data/regions.json');
    if (!res.ok) throw new Error('HTTP ' + res.status);
    return await res.json();
  } catch (e) {
    const l = document.getElementById('loading');
    if (l) {
      const box = document.createElement('div'), small = document.createElement('small');
      box.style.cssText = 'text-align:center;padding:0 16px;max-width:36em';
      small.textContent = (location.protocol === 'file:' ? '파일을 직접 열면(file://) 브라우저가 자료 읽기를 막아요. ' : '')
        + '저장소 루트에서 "python -m http.server 8000"(macOS·Linux는 python3)을 실행한 뒤 http://localhost:8000/prototype/ 으로 열어 주세요.';
      box.append('지역 자료(data/regions.json)를 불러오지 못했어요', small);
      l.setAttribute('role', 'alert'); l.replaceChildren(box);

})();
const REGIONS = (() => {
  const raw = REGIONS_RAW;
  const all = [];
  const bySgg = {};
  for (const [sido, sggs] of Object.entries(raw)) {
    for (const [sgg, dongs] of Object.entries(sggs)) {
      bySgg[sido + '|' + sgg] = dongs;
      for (const d of dongs) { d.sido = sido; d.sgg = sgg; d.lng = d.x / 1e4; d.lat = d.y / 1e4; all.push(d); }
    }
  }
  const byCode = new Map(all.map((d) => [d.c, d]));
  // 활성 지역 단위 (D-05): REGION_LEVEL 단계의 묶음. 시/도는 행정동 코드 앞 2자리, 시/군/구는 앞 5자리.
  const len = REGION_CODE_LEN[REGION_LEVEL] || 2;
  const units = [], byUnit = new Map();
  for (const d of all) {
    const c = d.c.slice(0, len);
    let u = byUnit.get(c);
    if (!u) {
      u = REGION_LEVEL === 'dong' ? d : { c, level: REGION_LEVEL, sido: d.sido, sgg: REGION_LEVEL === 'sido' ? '' : d.sgg, n: REGION_LEVEL === 'sido' ? (SIDO_SHORT[d.sido] || d.sido) : d.sgg, dongs: [], lat: 0, lng: 0 };
      byUnit.set(c, u); units.push(u);

    if (u !== d) { u.dongs.push(d); u.lat += d.lat; u.lng += d.lng; }
  }
  for (const u of units) if (u.dongs) { u.lat /= u.dongs.length; u.lng /= u.dongs.length; } // 중심 = 속한 동들의 평균
  // 시/도 요약 (지역 고르기 화면용. REGION_LEVEL과 상관없이 16곳)
  const sidoInfo = new Map();
  for (const d of all) {
    const c = d.c.slice(0, 2);
    let s = sidoInfo.get(c);
    if (!s) { s = { c, sido: d.sido, n: SIDO_SHORT[d.sido] || d.sido, dongs: [], sggs: new Set() }; sidoInfo.set(c, s); }
    s.dongs.push(d); s.sggs.add(d.sgg);
  }
  return {
    raw, all, byCode, bySgg, units, byUnit, sidoInfo,
    unitOf: (code) => byUnit.get(String(code || '').slice(0, len)) || null, // 동 코드·시/도 코드 어느 쪽이든 활성 단위로 변환
    sidos: Object.keys(raw),
    sggsOf: (sido) => Object.keys(raw[sido] || {}),
    dongsOf: (sido, sgg) => (raw[sido] && raw[sido][sgg]) || [],

      q = q.trim().replace(/\s+/g, '');
      if (!q) return [];
      const out = [];
      for (const d of all) {
        const full = (d.sido + d.sgg + d.n).replace(/\s+/g, '');
        if (d.n.startsWith(q)) out.push([0, d]);

      return d.p.map((flat) => { const pts = []; let x = d.x, y = d.y; for (let i = 0; i < flat.length; i += 2) { x += flat[i]; y += flat[i + 1]; pts.push([x / 1e4, y / 1e4]); } return pts; });
    },

function sggShort(sgg) { return (sgg || '').replace(/^(.+?시)(.+구)$/, '$1 $2'); }

function regionFull(d) { return d.level === 'sido' ? d.sido : [d.sido, sggShort(d.sgg), d.level === 'sgg' ? '' : d.n].filter(Boolean).join(' '); }

function themeFor(d) {
  const r = makeRng('theme:' + d.c);
  if (d.level === 'sido') return r.weighted(DO_CODES.includes(d.c) ? [['park', 5], ['alley', 3], ['market', 2]] : [['alley', 6], ['market', 2.5], ['park', 2.5]]);
  if (d.level === 'sgg') return r.weighted([['alley', 5], ['market', 2.5], ['park', 3]]);
  if (/[면]$/.test(d.n)) return r.weighted([['park', 6], ['alley', 3], ['market', 1]]);
  if (/[읍]$/.test(d.n)) return r.weighted([['market', 4], ['alley', 4], ['park', 2]]);
  if (/시장|중앙|남포|동문|서문|광장/.test(d.n)) return r.weighted([['market', 6], ['alley', 3], ['park', 1]]);
  if (/공원|숲|호수|천/.test(d.n)) return r.weighted([['park', 6], ['alley', 3]]);

}

function sunPosition(date, lat, lng) {
  const rad = Math.PI / 180;
  const d = (date.getTime() / DAY) - 10957.5; // days since J2000
  const g = (357.529 + 0.98560028 * d) * rad;
  const q = 280.459 + 0.98564736 * d;
  const L = (q + 1.915 * Math.sin(g) + 0.02 * Math.sin(2 * g)) * rad;
  const e = (23.439 - 0.00000036 * d) * rad;
  const RA = Math.atan2(Math.cos(e) * Math.sin(L), Math.cos(L));
  const dec = Math.asin(Math.sin(e) * Math.sin(L));
  const GMST = (18.697374558 + 24.06570982441908 * d) % 24;
  const LST = (GMST * 15 + lng) * rad;
  const HA = LST - RA;
  const alt = Math.asin(Math.sin(lat * rad) * Math.sin(dec) + Math.cos(lat * rad) * Math.cos(dec) * Math.cos(HA));
  const az = Math.atan2(-Math.sin(HA), Math.tan(dec) * Math.cos(lat * rad) - Math.sin(lat * rad) * Math.cos(HA));
  return { alt, az };
}

function canvasTex(w, hgt, draw, repeat) {

  const x = c.getContext('2d'); draw(x, w, hgt);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 4;
  if (repeat) { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(repeat[0], repeat[1]); }
  return t;
}

      vertexShader: 'varying vec3 vD; void main(){ vD = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }',
      fragmentShader: `uniform vec3 top; uniform vec3 hor; uniform vec3 sunDir; uniform vec3 sunCol; uniform float night; varying vec3 vD;

    this.sky.material.uniforms.night.value = 1 - day;
    LIGHT.sunDir.value.copy(dir);
    this.sun.position.copy(dir).multiplyScalar(14); this.sun.target.position.set(0, 0, -0.5);

    this.hemi.color.copy(new THREE.Color('#2a3558').lerp(new THREE.Color('#c4d6ee'), day));
    this.hemi.groundColor.copy(new THREE.Color('#151518').lerp(new THREE.Color('#6a5e52'), day));
    this.hemi.intensity = lerp(0.55, 1.0, day);
    LIGHT.sunCol.value.copy(sc);
    LIGHT.skyCol.value.copy(new THREE.Color('#1b2340').lerp(new THREE.Color('#8a9cb6'), day));
    LIGHT.gndCol.value.copy(new THREE.Color('#0d0d10').lerp(new THREE.Color('#4a423a'), day));
    const lampOn = 1 - smooth(clamp((deg + 2) / 8, 0, 1));
    this.lampOn = lampOn;
    LIGHT.lampOn.value = lampOn * 2.6;
    if (this.lampAt) { LIGHT.lampPos.value.copy(this.lampAt); this.lamp.position.copy(this.lampAt); }
    this.lamp.intensity = lampOn * 9;
    if (this.lampBulb) this.lampBulb.material.color.set(lampOn > 0.3 ? 0xffe2a8 : 0x9a9a92);
    const fog = hor.clone().lerp(skyTop, 0.2);
    this.scene.fog.color.copy(fog); LIGHT.fogCol.value.copy(fog);
    this.scene.background = fog;
    LIGHT.exposure.value = 1.0;
    this.renderer.toneMappingExposure = 1;
  }
  groundPick(ndcX, ndcY) {
    const rc = this._rc || (this._rc = new THREE.Raycaster());
    rc.setFromCamera({ x: ndcX, y: ndcY }, this.camera);
    const t = -rc.ray.origin.y / rc.ray.direction.y;
    if (t < 0) return null;
    return rc.ray.origin.clone().addScaledVector(rc.ray.direction, t);
  }
}

  pose(name, dur, extra, fx) { return { start(a) { a.setPose(name, extra); this.t = 0; }, tick(a, dt) { this.t += dt; if (fx) fx(a, this.t, dt); return this.t >= dur; } }; },
  walk(x, z, speed, opts = {}) { return { start(a) { a.moveTo(x, z, speed, opts); this.t = 0; }, tick(a, dt) { this.t += dt; return a.arrived || this.t > (opts.timeout || 14); } }; },
  face(yaw, extra) { return { start(a) { a.yawTarget = yaw; }, tick(a) { return Math.abs(angDiff(a.yaw, a.yawTarget)) < 0.12; } }; },
  faceYou() { return { start(a) { a.yawTarget = a.yawTo(a.world.youPoint()); a.lookAtYou = 1; }, tick(a) { return Math.abs(angDiff(a.yaw, a.yawTarget)) < 0.15; } }; },
  call(fn) { return { start(a) { fn(a); }, tick() { return true; } }; },
  wait(dur) { return { start() { this.t = 0; }, tick(a, dt) { this.t += dt; return this.t >= dur; } }; },
  // 세계 시계용: 도착한 뒤에 그 자리에서 단계를 만들어 끼워 넣기 / 다음 일정까지 그대로 머물기(가끔 두리번)
  lazy(fn) { return { start(a) { a.steps.unshift(...fn(a)); }, tick() { return true; } }; },
  hold() { return { start(a) { this.t = 0; this.n = a.r.range(4, 9); }, tick(a, dt) { this.t += dt; if (this.t > this.n) { this.t = 0; this.n = a.r.range(6, 14); a.lookRandom(); } return false; } }; },
};

function vnoise(seed, ms, periodMs) { // 시각에 따라 천천히 변하는 0~1 값 (칸 사이는 부드럽게 이음)

  return lerp(a, b, smooth(f));
}
function circadian(hour) { // 한낮·새벽에 졸림이 높고 해질녘·이른 아침에 낮은 하루 곡선
  const g = (x, c, w) => { let d = Math.abs(x - c); d = Math.min(d, 24 - d); return Math.exp(-(d * d) / (2 * w * w)); };
  return 0.2 + 0.5 * g(hour, 14, 3) + 0.45 * g(hour, 2.5, 3);
}
const Clock = {
  cache: new Map(),
  state(cat, ms, recent, personal) {
    const p = cat.g.personality, id = cat.id, kitten = cat.g.months < 6;

    const nz = (k, per) => vnoise(id + ':' + k, ms, per) - 0.5;
    const sleep = clamp(circadian(hour) + (0.5 - p.energy) * 0.3 + nz('sl', 900000) * 0.24 - (kitten ? 0.05 : 0), 0, 1);
    const passive = (recent || []).slice(0, 4).filter((k) => PASSIVE_KEYS.has(k)).length;
    const nAct = Math.min(4, (recent || []).length);
    const play = clamp(0.4 + 0.12 * (passive - nAct / 2) * (nAct ? 1 : 0) + (p.playful - 0.5) * 0.3 + (kitten ? 0.15 : 0) + nz('pl', 600000) * 0.2, 0, 1);

    const hunger = clamp(((ms - meal) / (9 * 3600000)) * (0.6 + 0.8 * p.food), 0, 1);
    const touch = personal ? store.get('touch:' + id, 0) : 0;
    const social = clamp(0.25 + (touch ? clamp((ms - touch) / (6 * 3600000), 0, 1) * 0.5 * (0.4 + p.social) : 0.15 * (0.4 + p.social)) + nz('so', 1200000) * 0.2, 0, 1);

    // 자세 보간
    const P = this.P, T = this.T;
    for (const k of PARAM_KEYS) {
      if (T[k] === undefined) continue;
      const rate = k === 'eye' || k === 'mouth' ? 10 : k === 'puff' ? 3 : k === 'h' ? 5 : 4.2;
      P[k] = damp(P[k], T[k], this.jump ? 14 : rate, dt);
    }
    // 최종 자세 = 보간값 + 오버레이
    const F = this.v.pose;
    for (const k of PARAM_KEYS) F[k] = P[k] + (this.ov[k] || 0);
    // 걸음걸이
    const ga = this.gaitAmt;
    if (ga > 0.01) {
      const ph = this.gait * TAU, run = this.runAmt;
      const legs = [['fls', 'fle', 0.25, 0.48], ['frs', 'fre', 0.75, 0.48], ['hls', 'hlk', 0.0, 0.42], ['hrs', 'hrk', 0.5, 0.42]];
      const runOff = { fls: 0.0, frs: 0.1, hls: 0.5, hrs: 0.6 };
      for (const [s, e, off, amp] of legs) {
        const o = lerp(off, runOff[s], run);
        const ps = ph + o * TAU;
        const a = amp * (1 + run * 0.6) * ga;
        F[s] += Math.sin(ps) * a;
        F[e] += Math.max(0, -Math.cos(ps)) * a * (s[0] === 'f' ? 1.3 : 1.1);
      }
      F.hr += Math.sin(ph) * 0.03 * ga * (1 - run);
      F.hp += Math.sin(ph * 1) * 0.12 * run;
      F.cp -= Math.sin(ph * 1) * 0.1 * run;
      F.hdp += Math.sin(ph * 2) * 0.03 * ga;
      this.v.root.position.y = this.jump ? this.v.root.position.y : Math.max(0, Math.sin(ph + 1)) * 0.03 * run * this.scale;
    }
    // 숨쉬기
    F.h += Math.sin(t * (F.eye < 0.2 ? 1.4 : 2.2)) * 0.0016;
    // 시선
    let lt = null;
    if (this.lookAtYou > 0) lt = this.world.camPos;
    else if (this.lookAt) lt = this.lookAt.headPt ? this.lookAt.headPt() : { x: this.lookAt.x, y: 0.15, z: this.lookAt.z };
    else if (this.lookPt) lt = this.lookPt;
    let wantYaw = 0, wantPitch = 0;
    if (lt && F.eye > 0.15) {
      const hy = this.yaw + F.hy + F.cy;
      const lm = this.enc ? 2.6 : 1.1; // 만나는 동안엔 몸이 옆·뒤를 향해도 상대를 볼 수 있게 목·머리를 크게(최대 약 150도) 돌린다
      // 만나는 동안은 몸 중심이 아니라 내 머리 자리에서 상대 머리를 잰다(나란히 설 때 머리가 몸보다 앞에 있어 각도가 크게 달라짐)
      const hp0 = this.enc && !this.sim ? this.headPt() : null, ox = hp0 ? hp0.x : this.x, oz = hp0 ? hp0.z : this.z;
      wantYaw = clamp(angDiff(hy, Math.atan2(lt.x - ox, lt.z - oz)), -lm, lm);
      const dd = Math.hypot(lt.x - ox, lt.z - oz);
      if (this.enc) { // 자세가 이미 몸·목·고개를 숙이거나 든 만큼(엉덩이·가슴·목·머리 기울기)을 빼서, 머리가 상대 머리 높이를 향하게
        const oy = this.sim ? 0.22 * this.scale : this.headPt().y;
        wantPitch = clamp(-Math.atan2((lt.y || 0) - oy, Math.max(dd, 0.2)) - (F.hp + F.cp + F.np + F.hdp), -1.1, 0.9);
      } else {
        wantPitch = clamp(-Math.atan2((lt.y || 0) - 0.25 * this.scale, dd) * 0.6, -0.5, 0.4);
        if (Math.abs(angDiff(hy, Math.atan2(lt.x - ox, lt.z - oz))) > 1.9) { wantYaw = 0; wantPitch = 0; }
      }
    }
    const lk = this.enc ? 9 : 5;
    this.lookYaw = damp(this.lookYaw, wantYaw, lk, dt); this.lookPitch = damp(this.lookPitch, wantPitch, lk, dt);
    if (this.enc) { F.cy += this.lookYaw * 0.25; F.ny += this.lookYaw * 0.75; } else F.ny += this.lookYaw; // 만날 때는 등뼈도 조금 비튼다(몸 방향은 그대로)
    F.hdp += this.lookPitch * (1 - Math.abs(F.hr) * 0.5);
    // 눈 깜빡임
    this.blinkT -= dt;
    if (this.blinkT < 0) { this.blink = 0.16; this.blinkT = this.r.range(2.5, 6.5); }
    if (this.blink > 0) { this.blink -= dt; F.eye *= 0.08; }
    if (this.slowT > 0) { this.slowT -= dt; const k = 1 - this.slowT / 1.6; F.eye *= 1 - Math.sin(k * Math.PI) * 0.88; }
    // 귀 쫑긋
    for (let i = 0; i < 2; i++) {
      this.earT[i] -= dt; if (this.earT[i] < 0) { this.earK[i] = 0.3; this.earT[i] = this.r.range(3, 11); }
      if (this.earK[i] > 0) { this.earK[i] -= dt; const k = Math.sin((this.earK[i] / 0.3) * Math.PI) * 0.55; if (i === 0) F.eL += k; else F.eR += k; }
    }
    // 가끔 울기
    this.meowT -= dt;
    if (this.meowT < 0) { this.meowT = this.r.range(25, 70); if (F.eye > 0.3 && !this.isReaction && !this.enc) this.say(this.kitten ? this.r.pick(['미야', '먀아', '삐약']) : this.r.pick(['냥', '야옹', '냐아', '앵'])); }
    // 배치
    this.v.root.position.x = this.x; this.v.root.position.z = this.z;
    this.v.root.rotation.y = this.yaw;
    if (!this.sim) this.v.update(t, dt);
  }
}

// ==== 68_visit.js ====
// ───────────────────────── 놀러가기 · 싸움 · 서로 바라보기 (R-13, D-18, 설계 7장) ─────────────────────────
// 서버 없이 시각만으로 정해진다 (D-19). 30분 칸마다 (지역코드, 칸 번호) 난수로 "누가 어느 이웃으로 몇 시 몇 초에 얼마나(60~120초) 놀러 가는지"를 정하고,
// 같은 칸 안의 외출끼리 겹치면 정해진 순서로 한쪽을 취소한다. 어느 탭에서 계산해도 같은 결과이므로 탭끼리 통신하지 않는다.
// 시험용: ?admin&tripdur=12,14 로 외출 길이(초)를 줄여 볼 수 있다(어드민 주소에서만 열림) (일정이 바뀌므로 같은 주소끼리만 같은 결과)
const TRIP_DUR = (() => { const q = new URLSearchParams(location.search); if (!q.has('admin')) return [60, 120]; const v = (q.get('tripdur') || '').split(',').map(Number); return v.length === 2 && v[0] > 0 && v[1] >= v[0] ? v : [60, 120]; })();
const TRIP = { SLOT: 30 * 60000, PROB: 0.54, DUR: TRIP_DUR, FIGHT: 0.73, ENTER: 8, LEAVE: 8, WALKOUT: 6 };
// 경계가 맞닿은 시/도 쌍 (경계 자료의 꼭짓점이 겹치는 곳을 한 번 계산해 둔 값). 제주는 이웃이 없어 놀러 가지 않는다.
// 11 서울 12 전남광주 26 부산 27 대구 28 인천 30 대전 31 울산 36 세종 41 경기 43 충북 44 충남 47 경북 48 경남 50 제주 51 강원 52 전북
const NEIGHBOR_PAIRS = '27-47 43-47 41-51 12-52 11-41 47-48 43-51 44-52 48-52 47-51 36-44 43-44 41-43 26-48 30-44 31-47 28-41 30-43 31-48 36-43 43-52 12-48 41-44 27-48 30-36 26-31 47-52 11-28';
const NEIGHBORS = (() => {
  const m = new Map();
  for (const pr of NEIGHBOR_PAIRS.split(' ')) { const [a, b] = pr.split('-'); if (!m.has(a)) m.set(a, []); if (!m.has(b)) m.set(b, []); m.get(a).push(b); m.get(b).push(a); }
  for (const v of m.values()) v.sort();
  return m;
})();
const unitName = (c) => { const u = REGIONS.byUnit.get(c); return u ? u.n : c; };

const Trips = {
  cache: new Map(),
  codes() { return REGIONS.units.map((u) => u.c).sort(); },
  neighbors(code) { return REGION_LEVEL === 'sido' ? (NEIGHBORS.get(code) || []) : []; }, // 시/군/구 단계의 이웃은 아직 만들지 않았다
  cat(code, ms) { const u = REGIONS.byUnit.get(code); return u ? dongPopulation(u, ms)[0] : null; },
  // 싸움이냐 어울리기냐: 평균 70%, 까칠한 쌍은 더 자주 싸우고 사교적인 쌍은 덜 싸운다
  kindOf(from, to, ms, id) {
    const a = this.cat(from, ms), b = this.cat(to, ms); if (!a || !b) return 'fight';
    const pa = a.g.personality, pb = b.g.personality;
    const pf = clamp(TRIP.FIGHT + 0.3 * ((pa.grumpy + pb.grumpy) / 2 - 0.5) - 0.25 * ((pa.social + pb.social) / 2 - 0.5), 0.4, 0.92);
    return makeRng('tripkind:' + id)() < pf ? 'fight' : 'play';
  },
  make(from, to, t0, durSec, kind, id) { return { id, from, to, t0, t1: t0 + durSec * 1000, kind: kind === 'fight' || kind === 'play' ? kind : this.kindOf(from, to, t0, id) }; },
  // 칸 si(30분)의 외출 목록. 외출은 칸 안에서 끝나므로 칸끼리 서로 영향이 없다.
  slot(si) {
    const hit = this.cache.get(si); if (hit) return hit;
    if (this.cache.size > 300) this.cache.clear();
    const cand = [];
    for (const from of this.codes()) {
      const nb = this.neighbors(from); if (!nb.length) continue;
      const r = makeRng('trip:' + from + ':' + si);
      if (!r.chance(TRIP.PROB)) continue; // 칸당 50% = 평균 한 시간에 한 번
      const to = r.pick(nb), dur = Math.round(r.range(TRIP.DUR[0], TRIP.DUR[1])), st = Math.round(r.range(30, 1800 - dur - 30)), pri = r();
      cand.push({ from, to, dur, st, pri });
    }
    cand.sort((a, b) => a.pri - b.pri || (a.from < b.from ? -1 : 1));
    const busy = {}, out = [];
    const free = (c, t0, t1) => !(busy[c] || []).some((x) => t0 < x[1] && x[0] < t1);
    for (const c of cand) { // 가려는 이웃이 그 시각에 외출 중이거나 이미 손님이 있으면, 또는 내가 손님을 맞는 중이면 이번 외출은 취소
      const t0 = si * TRIP.SLOT + c.st * 1000, t1 = t0 + c.dur * 1000;
      if (!free(c.from, t0, t1) || !free(c.to, t0, t1)) continue;
      for (const k of [c.from, c.to]) (busy[k] = busy[k] || []).push([t0, t1]);
      const id = si + ':' + c.from;
      out.push({ id, from: c.from, to: c.to, t0, t1, kind: this.kindOf(c.from, c.to, t0, id) });
    }
    out.sort((a, b) => a.t0 - b.t0);
    this.cache.set(si, out);
    return out;
  },
  at(code, ms) { // 그 시각 code 지역의 마스코트가 나가 있는지(away) / 손님을 맞는 중인지(host)
    let away = null, host = null;
    for (const t of this.slot(Math.floor(ms / TRIP.SLOT))) if (ms >= t.t0 && ms < t.t1) { if (t.from === code) away = t; if (t.to === code) host = t; }
    return { away, host };
  },
  between(t0, t1) {
    const out = [];
    for (let si = Math.floor(t0 / TRIP.SLOT); si * TRIP.SLOT < t1; si++) for (const t of this.slot(si)) if (t.t1 > t0 && t.t0 < t1) out.push(t);
    return out;
  },
};

// 두 마리가 만나는 동안의 단계표. 시각(초)만으로 어느 단계인지 정해지고, 두 고양이는 그 단계표를 따라 움직인다.
// 서로 바라보기: 만나는 내내 두 마리의 시선(lookAt)을 상대 머리에 묶고, 단계마다 몸 방향(yaw)과 떨어진 거리를 정한다.
class Encounter {
  constructor(app, trip, host, guest, o = {}) {
    this.app = app; this.trip = trip; this.host = host; this.guest = guest; this.kind = trip.kind;
    this.dur = (trip.t1 - trip.t0) / 1000; this.t = 0; this.wall = !o.manual; this.paused = false; this.stepMode = !!o.stepMode; this.done = false;
    this.build();
    this.ph = this.phases[0];
    host.enc = guest.enc = this; host.ext = guest.ext = true; host._ph = guest._ph = null;
    host.steps = []; host.step = null; host.move = null; host.arrived = true; host.jump = null; host.lookAtYou = 0; host.v.root.position.y = 0;
    guest.x = this.edge.x; guest.z = this.edge.z;
    guest.yaw = guest.yawTarget = Math.atan2(this.M.x - guest.x, this.M.z - guest.z);
    guest.setPose('stand'); Object.assign(guest.P, guest.T);
  }
  build() {
    const E = this, H = this.host, G = this.guest, W = H.world, r = makeRng('enc:' + this.trip.id), B = 0.3 * (H.scale + G.scale);
    this.B = B;
    const narrow = innerWidth <= 720;
    let M = { x: 0, z: 0 }, u = { x: 1, z: 0 };
    for (let i = 0; i < 40; i++) { // 만나는 자리(M)와 두 마리를 잇는 축(u): 옆에서 보이도록 가로로 두고, 장애물이 없는 곳
      const th = r.range(-0.3, 0.3) + (r.chance(0.5) ? 0 : Math.PI), uu = { x: Math.cos(th), z: Math.sin(th) };
      const m = { x: r.range(-1, 1) * (narrow ? 0.3 : 0.9), z: r.range(-0.5, 0.45) };
      if ([-0.9, 0, 0.9].every((k) => !W.blocked(m.x + uu.x * B * k, m.z + uu.z * B * k, 0.2))) { M = m; u = uu; break; }
    }
    this.M = M; this.u = u;
    const side = u.x >= 0 ? 1 : -1;
    this.edge = { x: side > 0 ? BOUNDS.x1 - 0.03 : BOUNDS.x0 + 0.03, z: clamp(M.z + r.range(-0.15, 0.15), BOUNDS.z0 + 0.25, BOUNDS.z1 - 0.2) };
    // 중심 c에서 축 uu 방향으로 sep(몸길이 단위, 1 = 코끼리 닿는 거리)만큼 떨어진 두 마리의 자리
    const at = (c, uu, sep, role) => ({ x: c.x + (role === 'host' ? -1 : 1) * uu.x * sep * B / 2, z: c.z + (role === 'host' ? -1 : 1) * uu.z * sep * B / 2 });
    const sc = (a) => a.p.bold + 0.5 * a.p.grumpy + r.range(-0.25, 0.25);
    const hostWins = sc(H) >= sc(G);
    this.winner = hostWins ? 'host' : 'guest'; this.loser = hostWins ? 'guest' : 'host';
    const ph = [];
    const add = (id, name, w, o2) => ph.push({ id, name, w, ...o2 });
    const fight = this.kind === 'fight';
    add('enter', '손님이 들어옴', 0, {
      fixed: TRIP.ENTER, pos: (role) => at(M, u, fight ? 1.7 : 1.5, role), speed: { host: 1.0, guest: 1.8 },
      pose: (role) => (fight ? (role === 'host' ? ['alert', { pupil: 0.85 }] : ['stand', { pupil: 0.8 }]) : ['greet']),
      label: { host: fight ? '낯선 고양이를 경계하는 중' : '손님을 맞는 중', guest: '낯선 골목을 구경하며 들어오는 중' },
    });
    let endC = M; // 마지막 단계들의 중심
    if (fight) {
      // 진 쪽이 달아날 곳: 이긴 쪽의 반대 방향으로 멀리, 장애물이 없는 자리
      const lp = at(M, u, 1.1, this.loser), wp = at(M, u, 1.1, this.winner), away = Math.atan2(lp.z - wp.z, lp.x - wp.x);
      let P = null;
      for (let i = 0; i < 14 && !P; i++) {
        const ang = away + r.range(-0.9, 0.9), d = r.range(1.3, 2.0);
        const q = { x: clamp(lp.x + Math.cos(ang) * d, BOUNDS.x0 + 0.3, BOUNDS.x1 - 0.3), z: clamp(lp.z + Math.sin(ang) * d, BOUNDS.z0 + 0.3, BOUNDS.z1 - 0.2) };
        if (!W.blocked(q.x, q.z, 0.25)) P = q;
      }
      this.fleeTo = P || { x: clamp(lp.x + Math.cos(away) * 0.8, BOUNDS.x0 + 0.3, BOUNDS.x1 - 0.3), z: clamp(lp.z + Math.sin(away) * 0.5, BOUNDS.z0 + 0.3, BOUNDS.z1 - 0.2) };
      add('glare', '노려보기', 0.2, { pos: (role) => at(M, u, 1.5, role), speed: 0.6,
        pose: ['crouch', { pupil: 1, eL: 0.85, eR: 0.85, puff: 0.55, tb: 1.25, twf: 2.2, tw: 0.2 }],
        label: '귀를 젖히고 노려보는 중', fx: (a, tl) => { a.ov.hdp = Math.sin(tl * 1.6) * 0.02; },
        says: [[0.8, 'host', '으르릉…'], [2.6, 'guest', '…']] });
      add('side', '옆으로 몸 세우기', 0.14, { pos: (role) => at(M, u, 1.3, role), speed: 0.5,
        pose: ['hiss', { mouth: 0 }], label: '털을 세우고 몸을 옆으로 세우는 중',
        yaw: (a, o, role) => a.yawTo(o) + (role === 'host' ? 1 : -1) * Math.PI / 2, fx: (a, tl) => { a.ov.hr = Math.sin(tl * 2) * 0.04; } });
      add('cry', '울음소리', 0.12, { pos: (role) => at(M, u, 1.15, role), speed: 0.5,
        pose: ['hiss', {}], label: '긴 울음소리를 내는 중', fx: (a, tl) => { a.ov.mouth = -0.45 * (0.5 + 0.5 * Math.sin(tl * 7)); },
        says: [[0.3, 'host', '라오오- 니겅니겅니겅'], [2.6, 'guest', '캬아아악!']] });
      add('swat', '앞발 치기', 0.2, { pos: (role) => at(M, u, 1.1, role), speed: 0.5,
        pose: ['groom', { fls: -1.1, fle: -0.2, eL: 0.6, eR: 0.6, eye: 1, hdp: 0.2, np: 0.2, pupil: 1, puff: 0.4 }], label: '앞발을 휘두르는 중',
        fx: (a, tl, role) => { const k = (tl * 0.9 + (role === 'guest' ? 0.5 : 0)) % 1; a.ov.fls = Math.sin(tl * 22) * 0.35 * (k < 0.4 ? 1 : 0.1); },
        says: [[0.2, 'host', '냥!'], [1.4, 'guest', '캭!'], [3.0, 'host', '냥냥!']] });
      add('chase', '추격', 0.2, {
        pos: (role, _E, tl) => {
          if (role === E.loser) return tl < 0.4 ? null : E.fleeTo;
          const l = E[E.loser], c = E[E.winner], dx = c.x - l.x, dz = c.z - l.z, d = Math.hypot(dx, dz) || 1, stop = 0.8 * B;
          return d <= stop ? null : { x: l.x + dx / d * stop, z: l.z + dz / d * stop };
        },
        speed: { [this.loser]: 3.1, [this.winner]: 2.4 },
        pose: (role) => (role === E.loser ? ['crouch', { pupil: 0.9, eL: 0.6, eR: 0.6 }] : ['alert', { pupil: 0.8 }]),
        label: { [this.winner]: '쫓아가는 중', [this.loser]: '도망치는 중' },
        says: [[0.2, this.loser, '!']] });
      add('retreat', '한쪽이 물러남', 0.14, { pos: null,
        pose: (role) => (role === E.loser ? ['loaf', { eL: 0.5, eR: 0.5, pupil: 0.9 }] : ['sit', { puff: 0.2, pupil: 0.7 }]),
        label: { [this.winner]: '으스대는 중', [this.loser]: '움츠러든 중' },
        yaw: (a, o, role) => (role === E.loser ? a.yawTo(o) + Math.PI * 0.55 : a.yawTo(o)), // 진 쪽은 몸은 돌려도 고개는 돌아본다
        says: [[1.0, this.winner, '흥']] });
    } else {
      add('sniff', '코인사', 0.22, { pos: (role) => at(M, u, 1.0, role), speed: 0.5,

        says: [[0.8, 'host', '냥'], [2.0, 'guest', '먀']] });

          const c = { x: clamp(cur.x + Math.cos(ang) * d, BOUNDS.x0 + 0.5, BOUNDS.x1 - 0.5), z: clamp(cur.z + Math.sin(ang) * d * 0.7, BOUNDS.z0 + 0.4, BOUNDS.z1 - 0.3) };
          if (!W.blocked(c.x, c.z, 0.3)) q = c;
        }
        q = q || cur; wps.push(q); cur = q;
      }
      endC = wps[2];
      add('walk', '나란히 걷기', 0.3, {
        pos: (role, _E, tl, p) => {
          const seg = clamp(Math.floor(tl / (p.dur / 3)), 0, 2), p0 = seg === 0 ? M : wps[seg - 1], p1 = wps[seg];
          const dx = p1.x - p0.x, dz = p1.z - p0.z, d = Math.hypot(dx, dz) || 1, off = (role === 'host' ? -1 : 1) * 0.32 * B;
          return { x: p1.x - dz / d * off, z: p1.z + dx / d * off };
        },
        speed: 0.9, label: '나란히 걷는 중' });
      add('groom', '서로 그루밍', 0.24, { pos: (role) => at(endC, u, 1.0, role), speed: 0.6, pose: ['groom', {}], label: '서로 털을 핥아 주는 중',
        fx: (a, tl, role, _E, p) => {
          if ((tl < p.dur / 2) === (role === 'host')) { a.ov.hdp = Math.sin(tl * 9) * 0.09; a.ov.fle = Math.sin(tl * 9) * 0.12; a.ov.mouth = 0.12 + Math.sin(tl * 9) * 0.1; }
          else { a.ov.fls = 1.5; a.ov.fle = 1.25; a.ov.hdr = 0.2; a.ov.eye = -0.25; } // 받는 쪽은 앞발을 내리고 눈을 가늘게
        } });
      const n = { x: -u.z, z: u.x }; if (n.z < 0) { n.x = -n.x; n.z = -n.z; } // 식빵은 같은 쪽(화면 앞쪽)을 보고 나란히
      add('loaf', '나란히 식빵', 0.2, { pos: (role) => at(endC, u, 0.75, role), speed: 0.6, pose: ['loaf', {}], label: '나란히 식빵을 굽는 중',
        yaw: () => Math.atan2(n.x, n.z), says: [[2.0, 'host', '그르릉']] });

      fixed: TRIP.LEAVE, pos: (role) => (role === 'guest' ? { x: this.edge.x, z: this.edge.z } : null), speed: 1.7,
      pose: (role) => (fight && role === E.loser ? ['loaf', { eL: 0.4, eR: 0.4, pupil: 0.8 }] : ['sit']),
      label: { host: '떠나는 손님을 지켜보는 중', guest: '자기 동네로 돌아가는 중' },
      yaw: (a, o, role) => (fight && role === 'host' && E.loser === 'host' ? a.yawTo(o) + Math.PI * 0.55 : a.yawTo(o)),
    });
    // 단계 길이: 들어옴·돌아감은 고정, 나머지는 남은 시간을 가중치대로 나눔
    const mid = Math.max(10, this.dur - TRIP.ENTER - TRIP.LEAVE), sw = ph.reduce((s, p) => s + (p.fixed ? 0 : p.w), 0);
    let t = 0;
    for (const p of ph) { p.dur = p.fixed || (p.w / sw) * mid; p.t0 = t; t += p.dur; p.t1 = t; }
    this.phases = ph; this.total = t;
  }
  phaseAt(t) { const ps = this.phases; for (const p of ps) if (t < p.t1) return p; return ps[ps.length - 1]; }
  // 매 프레임 (앱이 부름). wall이면 시계(지금 - 시작)를 따르고, manual이면 dt만큼 흘러가며 멈춤·다음 단계가 된다.
  step(dt) {
    if (this.done) return;
    const target = this.wall ? (Date.now() - this.trip.t0) / 1000 : this.paused ? this.t : this.t + dt;
    if (target - this.t > 1.2) this.ffTo(target); else this.t = target;
    const ph = this.phaseAt(this.t);
    if (this.stepMode && !this.wall && !this.paused && ph !== this.ph && this.t < this.dur) { this.paused = true; this.t = ph.t0 + 0.001; } // 단계가 바뀌는 곳에서 멈춤
    this.ph = this.phaseAt(this.t);
    if (this.t >= this.dur) this.finish();
  }
  ffTo(target) { // 화면 없이 빨리 감기 (중간에 들어온 사람도 같은 자리에서 시작)
    const a = this.host, b = this.guest; a.sim = b.sim = true;
    target = Math.min(target, this.dur);
    while (this.t < target - 1e-6) { const d = Math.min(0.1, target - this.t); this.t += d; this.ph = this.phaseAt(this.t); a.update(d); b.update(d); }
    a.sim = b.sim = false;
  }
  nextPhase() { // 다음 단계 시작으로 건너뛰기 (멈춘 채로)
    this.wall = false; const i = this.phases.indexOf(this.phaseAt(this.t)), nx = this.phases[Math.min(i + 1, this.phases.length - 1)];
    this.t = nx.t0 + 0.001; this.ph = nx; this.paused = true;
  }
  finish() { if (this.done) return; this.done = true; this.app.endEnc(this); }
}

// 로컬 모의 어댑터 (D-21): window.claude가 없는 로컬 시험 환경에서만. 사용자 흉내(어드민 판별) + room(사람 수·순간 메시지) + lock(먼저 잡은 한 명).
// 탭끼리는 BroadcastChannel로 이야기한다. 잠금은 localStorage의 한 칸(탭 사이 거의 동시에 눌러도 한 명만 남게 쓴 뒤 다시 읽어 확인).
// 게시판·이웃 데이터(db)는 지금처럼 브라우저 localStorage로 대신한다.
const LOCAL_HOSTS = ['localhost', '127.0.0.1', '[::1]', ''];
const LocalMock = {
  usable: () => LOCAL_HOSTS.includes(location.hostname),
  user: () => ({ id: async () => null, isOwner: async () => true, can: async () => true }),
  // room: join(이름) 한 곳에 들어가 있고, count(이름)으로 그 곳 사람 수(나 포함), send/on으로 모든 탭에 순간 메시지
  room() {
    const id = 'p' + Math.random().toString(36).slice(2, 9), peers = new Map(), handlers = [], countFns = [];
    let ch = null, name = null, timer = null;
    try { ch = new BroadcastChannel('golmok-room'); } catch (e) {}
    const sweep = () => { const t = Date.now(); for (const [k, v] of peers) if (t - v.at > 7000) peers.delete(k); };
    const beat = () => { if (ch) try { ch.postMessage({ t: 'hb', id, r: name }); } catch (e) {} };
    const changed = () => { sweep(); const n = R.count(); for (const f of countFns) f(n); };
    const R = {
      id, live: !!ch,
      join(n) { name = n; beat(); changed(); },
      count(n = name) { sweep(); let c = n === name ? 1 : 0; for (const v of peers.values()) if (v.r === n) c++; return c; },
      onCount(f) { countFns.push(f); },
      send(kind, data) { if (ch) try { ch.postMessage({ t: 'msg', id, kind, data }); } catch (e) {} },
      on(f) { handlers.push(f); },
    };
    if (ch) {
      ch.onmessage = (ev) => {
        const m = ev.data || {};
        if (m.id === id) return;
        if (m.t === 'hb') { const known = peers.has(m.id); peers.set(m.id, { r: m.r, at: Date.now() }); if (!known) beat(); changed(); }
        else if (m.t === 'bye') { peers.delete(m.id); changed(); }
        else if (m.t === 'msg') for (const f of handlers) f(m.kind, m.data, m.id);
      };
      timer = setInterval(() => { beat(); changed(); }, 2500);
      addEventListener('pagehide', () => { try { ch.postMessage({ t: 'bye', id }); } catch (e) {} clearInterval(timer); });
    }
    return R;
  },
  // lock: acquire(키, {holder, ttlMs}) -> 성공하면 true. 이미 다른 사람이 잡고 있으면(만료 전) false
  lock() {
    const k = (key) => 'golmok:lock:' + key;
    const read = (key) => { try { return JSON.parse(localStorage.getItem(k(key)) || 'null'); } catch (e) { return null; } };
    return {
      // 읽기-확인-쓰기를 한 덩어리로 묶는다: Web Locks(같은 출처의 모든 탭이 차례로 지나감)를 쓰고, 없는 환경이면 쓴 뒤 다시 읽는 옛 방식으로 되돌아간다
      acquire(key, { holder, ttlMs }) {
        const attempt = () => {
          const now = Date.now(), cur = read(key);
          if (cur && cur.until > now) return false;
          try { localStorage.setItem(k(key), JSON.stringify({ holder, until: now + ttlMs })); } catch (e) { return true; }
          return true;
        };
        if (navigator.locks && typeof navigator.locks.request === 'function') return navigator.locks.request('golmok-lock:' + key, () => attempt()).catch(() => { const ok = attempt(); const a = read(key); return ok && !!a && a.holder === holder; });
        const ok = attempt(), after = read(key);
        return Promise.resolve(ok && !!after && after.holder === holder);
      },
      peek: (key) => { const c = read(key); return c && c.until > Date.now() ? c : null; },
      clear(key) { try { localStorage.removeItem(k(key)); } catch (e) {} },
    };
  },
};
async function initCaps() {
  if (!window.claude || typeof window.claude.use !== 'function') {
    if (LocalMock.usable()) { Caps.user = LocalMock.user(); Caps.mock = true; Caps.room = LocalMock.room(); Caps.lock = LocalMock.lock(); }
    Caps.ready = true; return;
  }
  const get = (n) => window.claude.use(n).catch(() => null);
  const [user, db, sample, downloads] = await Promise.all([get('user'), get('db'), get('sample'), get('downloads')]);
  Object.assign(Caps, { user, db, sample, downloads });
  if (user) { try { Caps.uid = await user.id(); } catch (e) {} }
  if (db && !Caps.uid) Caps.db = null; // 개인 기록이 없는 보기에서는 이 브라우저 체험 모드
  Caps.shared = !!Caps.db;
  if (user && Caps.db) { try { const can = await user.can('data.write'); if (can === false) Caps.writeOff = true; } catch (e) {} }
  Caps.ready = true;
}

const Names = {
  dong: null, list: [], unsub: null, listeners: [], ready: false, asUid: null, // asUid: 어드민 시험용 가짜 세션
  on(fn) { this.listeners.push(fn); },
  emit() { for (const f of this.listeners) f(this.visible()); },
  me() { return this.asUid || Caps.uid || 'local'; },
  cnt: (m) => Object.values(m || {}).filter(Boolean).length,
  dead(n) { return !!n.gone || this.cnt(n.down) > this.cnt(n.up) || this.cnt(n.rep) >= NAME_RULE.REPORT_DEL; },
  visible() { return this.list.filter((n) => !this.dead(n)); },
  watch(code, force) {
    if (this.dong === code && !force) return;
    if (this.unsub) { try { this.unsub(); } catch (e) {} this.unsub = null; }
    this.dong = code; this.list = []; this.ready = false;
    if (Caps.db) {
      try {
        this.unsub = Caps.db.collection('names2/' + code + '/list').limit(300).onSnapshot((snap) => {
          if (this.dong !== code) return;
          this.list = snap.docs.map((d) => ({ id: d.id, ...d.data() })); this.ready = true; this.emit();
        }, () => { this.ready = true; this.emit(); });
      } catch (e) { this.ready = true; this.emit(); }
    } else { this.loadLocal(); }
    if (!this.storageOn) { // 로컬 모의: 다른 탭에서 바뀐 이름 목록을 반영
      this.storageOn = true;
      addEventListener('storage', (e) => { if (!Caps.db && this.dong && (e.key === 'golmok:names2:' + this.dong || e.key === null)) this.loadLocal(); });
    }
  },
  loadLocal() { this.list = store.get('names2:' + this.dong, []); this.ready = true; this.emit(); },
  score(n) { return this.cnt(n.up); },
  ranked() {
    return this.visible().map((n) => ({ ...n, score: this.score(n), dislikes: this.cnt(n.down) }))
      .sort((a, b) => b.score - a.score || a.dislikes - b.dislikes || (a.createdAt || 0) - (b.createdAt || 0)).slice(0, NAME_RULE.SHOW);
  },
  top() { const r = this.ranked()[0]; return r && r.score > 0 ? r : null; },
  mine() { const me = this.me(); return this.list.filter((n) => n.uid === me && !this.dead(n)).length; },
  saveLocal() { store.set('names2:' + this.dong, this.list); this.emit(); },
  // 입력 정리: 제어문자·보이지 않는 글자 제거, 공백 정리, 길이·글자 종류 제한
  clean(raw) { return String(raw || '').replace(NAME_BAD, ' ').replace(/\s+/g, ' ').trim(); },
  check(raw) {
    const name = this.clean(raw);
    if (name.length < 1 || name.length > NAME_RULE.MAXLEN) return { err: `이름은 1~${NAME_RULE.MAXLEN}자로 지어 주세요.` };
    if (!/^[가-힣a-zA-Z0-9 ]+$/.test(name)) return { err: '한글, 영문, 숫자만 쓸 수 있어요.' };
    return { name };
  },
  norm: (s) => String(s || '').replace(/\s/g, '').toLowerCase(),
  async patch(item, fields) { // 바뀐 필드를 저장하고, 규칙에 걸리면 삭제 표시까지 한 번에
    const n = this.list.find((x) => x.id === item.id) || item;
    Object.assign(n, fields);
    const gone = this.dead(n);
    if (gone) n.gone = true;
    if (Caps.db) await Caps.db.doc('names2/' + this.dong + '/list/' + item.id).update(gone ? { ...fields, gone: true } : fields);
    else this.saveLocal();
    if (Caps.db) this.emit();
    return { gone };
  },
  async propose(raw) {
    const c = this.check(raw); if (c.err) throw new Error(c.err);
    const same = this.list.find((n) => this.norm(n.name) === this.norm(c.name));
    const me = this.me();
    if (same) {
      if (this.dead(same)) throw new Error('이 이름은 이웃들의 판단으로 내려졌어요. 다른 이름을 지어 주세요.');
      if (!(same.up || {})[me]) await this.vote(same, 'up'); return { dup: true, item: same };
    }
    if (this.mine() >= NAME_RULE.PER_SESSION) throw new Error(`한 지역 고양이에게는 이름을 ${NAME_RULE.PER_SESSION}개까지 제안할 수 있어요.`);
    if (this.visible().length >= NAME_RULE.CAP) throw new Error('이 고양이의 이름 후보가 가득 찼어요. 싫어요가 많은 이름이 정리되면 다시 제안해 주세요.');
    const item = { name: c.name, uid: me, nick: Member.me ? Member.me.nick : '이웃', createdAt: Date.now(), up: { [me]: true }, down: {}, rep: {} };
    if (Caps.db) { const ref = await Caps.db.collection('names2/' + this.dong + '/list').add(item); return { item: { id: ref.id, ...item } }; }
    const id = 'n' + Date.now().toString(36) + Math.random().toString(36).slice(2, 5); this.list.push({ id, ...item }); this.saveLocal(); return { item: { id, ...item } };
  },
  // 좋아요('up') / 싫어요('down'): 한 세션이 하나만, 같은 걸 다시 누르면 취소
  async vote(item, kind) {
    const me = this.me(), n = this.list.find((x) => x.id === item.id) || item, was = !!(n[kind] || {})[me], other = kind === 'up' ? 'down' : 'up';
    return this.patch(n, { [kind]: { ...(n[kind] || {}), [me]: !was }, [other]: { ...(n[other] || {}), [me]: false } });
  },
  async report(item) {
    const me = this.me(), n = this.list.find((x) => x.id === item.id) || item;
    if ((n.rep || {})[me]) return { already: true };
    const r = await this.patch(n, { rep: { ...(n.rep || {}), [me]: true } });
    return { ...r, already: false };
  },
};

const swatch = (g) => {
  const c = g.colors, P = g.pattern;
  if (P === 'calico') return `conic-gradient(${c.base} 0 35%, ${c.white} 0 70%, ${c.patch} 0)`;
  if (P === 'tortie') return `conic-gradient(${c.base} 0 55%, ${c.patch} 0)`;
  if (g.whiteAmt >= 1) return c.white;
  if (g.whiteAmt > 0.3) return `linear-gradient(180deg, ${c.base} 0 55%, ${c.white} 55%)`;
  if (g.stripeAmt > 0.5) return `repeating-linear-gradient(90deg, ${c.base} 0 5px, ${c.stripe} 5px 8px)`;
  return c.base;
};
function toast(msg, ms = 2600) {
  const t = h('div', { class: 'toast', role: 'status', text: msg });
  document.body.append(t);
  setTimeout(() => { t.style.opacity = '0'; t.style.transition = 'opacity .4s'; }, ms);
  setTimeout(() => t.remove(), ms + 500);
}
function openScrim(content, { center = false, onClose } = {}) {
  const s = h('div', { class: 'scrim' + (center ? ' center' : ''), role: 'dialog', 'aria-modal': 'true' }, content);
  const close = () => { s.remove(); document.removeEventListener('keydown', esc); onClose && onClose(); };
  const esc = (e) => { if (e.key === 'Escape') close(); };
  s.addEventListener('pointerdown', (e) => { if (e.target === s) close(); });
  document.addEventListener('keydown', esc);
  document.body.append(s);
  const f = s.querySelector('input,textarea,button'); if (f) setTimeout(() => f.focus(), 30);
  return close;
}
function timeAgo(ts) {
  const d = (Date.now() - ts) / 1000;
  if (d < 60) return '방금'; if (d < 3600) return Math.floor(d / 60) + '분 전'; if (d < 86400) return Math.floor(d / 3600) + '시간 전';
  return new Date(ts).toLocaleDateString('ko-KR', { month: 'long', day: 'numeric' });
}
