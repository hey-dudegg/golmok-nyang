<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="stylesheet" href="style.css"></head><body>
<title>골목냥</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&family=IBM+Plex+Mono:wght@400;500&display=swap">

<div id="stage"><canvas id="c3d" tabindex="0" aria-label="골목 3D 장면. 고양이를 눌러 자세히 보세요."></canvas></div>
<div id="bubbles"></div>
<svg id="hand" viewBox="0 0 64 64" aria-hidden="true"><path d="M22 34V16a4 4 0 0 1 8 0v14m0-2V12a4 4 0 0 1 8 0v18m0-6a4 4 0 0 1 8 0v10m0-4a4 4 0 0 1 8 0v12c0 10-7 18-17 18h-3c-6 0-10-3-13-8l-7-12a4 4 0 0 1 6-5l4 5" fill="#fbfaf7" stroke="#1c2026" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>

<div id="plate" class="ui">
  <div class="plate">
    <span class="up" id="pUp">서울특별시 종로구</span>
    <span class="dong" id="pDong">삼청동</span>
    <span class="code" id="pCode">1111054000</span>
    <button class="move" id="btnMove" type="button">지역 바꾸기</button>
  </div>
  <div class="census"><span id="census">고양이를 찾는 중…</span><span class="viewers" id="viewers" role="status" aria-label="지금 보고 있는 사람 1명"><svg class="i" viewBox="0 0 24 24"><path d="M2 12s3.6-6.5 10-6.5S22 12 22 12s-3.6 6.5-10 6.5S2 12 2 12z"/><circle cx="12" cy="12" r="2.8"/></svg><b id="viewersN">1</b></span></div>
</div>

<div id="tools" class="ui">
  <span class="pill" id="clock" title="이 지역의 실제 시각과 해의 높이를 따릅니다"><span class="dot" id="clockDot"></span><span class="mono" id="clockT">--:--</span><span id="clockL" class="hide-sm">낮</span></span>
  <button class="pill" id="btnBoard" type="button"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 9h10M7 13h10M7 17h6"/></svg>자유게시판</button>
  <button class="pill cta" id="btnMember" type="button">이웃 등록</button>
</div>

<div id="roster" class="ui" aria-label="지금 이 골목의 고양이"></div>
<button id="share" class="ui" type="button" aria-label="공유하기" title="공유하기"><svg class="i" viewBox="0 0 24 24"><circle cx="18" cy="5.5" r="2.6"/><circle cx="6" cy="12" r="2.6"/><circle cx="18" cy="18.5" r="2.6"/><path d="M8.3 10.8l7.4-4M8.3 13.2l7.4 4"/></svg></button>
<button id="promo" class="ui" type="button" aria-label="구경 오세요 홍보하기" data-tip="구경 오세요"><svg class="i" viewBox="0 0 24 24"><path d="M3 10v4h3l7 4V6L6 10z"/><path d="M16.5 9a4 4 0 0 1 0 6"/><path d="M19 6.5a7.5 7.5 0 0 1 0 11"/></svg><svg class="waves i" viewBox="0 0 24 24" aria-hidden="true"><path d="M16.5 9a4 4 0 0 1 0 6M19 6.5a7.5 7.5 0 0 1 0 11M21.5 4a11 11 0 0 1 0 16"/></svg></button>
<button id="capture" class="ui" type="button" aria-label="지금 장면 캡쳐"><svg class="i" viewBox="0 0 24 24"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.6"/></svg></button>
<section id="card" class="ui panel" hidden aria-live="polite"></section>
<div id="loading">골목으로 가는 중<small>털을 한 올씩 빗는 중이에요</small></div>

<!-- 행정구역 경계 JSON은 data/regions.json (모듈에서 fetch). 한 줄이 매우 길어 통째로 읽지 않는다 -->
<script>// file://로 열면 브라우저가 src/ 모듈 import 자체를 막아 아래 로더의 모듈이 돌지 않는다(D-33). 지역 자료 fetch 실패 안내와 같은 문구를 여기서 먼저 띄운다 (D-35)
if (location.protocol === 'file:') { const l = document.getElementById('loading'); if (l) { const box = document.createElement('div'), small = document.createElement('small'); box.style.cssText = 'text-align:center;padding:0 16px;max-width:36em'; small.textContent = '파일을 직접 열면(file://) 브라우저가 자료 읽기를 막아요. 저장소 루트에서 "python -m http.server 8000"(macOS·Linux는 python3)을 실행한 뒤 http://localhost:8000/prototype/ 으로 열어 주세요.'; box.append('지역 자료(data/regions.json)를 불러오지 못했어요', small); l.setAttribute('role', 'alert'); l.replaceChildren(box); } }
</script>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<!-- 코드는 src/ 아래 ES 모듈이고 시작은 src/main.js 다 (D-33 단계 3). 폴더 구조는 CLAUDE.md, 시험은 tests/README.md -->
<script type="module">
// 진입 로더: 모듈 하나라도 받지 못하거나(404·망 오류) 불러오는 중 오류가 나면 로딩 화면에서 멈추지 않고 안내를 띄운다.
// 지역 자료(data/regions.json) 안내나 file:// 안내가 이미 떠 있으면(role=alert) 그대로 둔다.
import('./src/main.js').catch((e) => {
  console.error('골목냥 모듈 불러오기 실패:', e);
  const l = document.getElementById('loading');
  if (!l || l.getAttribute('role') === 'alert') return;
  const box = document.createElement('div'), small = document.createElement('small');
  box.style.cssText = 'text-align:center;padding:0 16px;max-width:36em';
  small.textContent = (location.protocol === 'file:' ? '파일을 직접 열면(file://) 브라우저가 자료 읽기를 막아요. ' : '')
    + '저장소 루트에서 "python -m http.server 8000"(macOS·Linux는 python3)을 실행한 뒤 http://localhost:8000/prototype/ 으로 열어 주세요.'
    + ' 서버로 열었는데도 이 안내가 보이면 새로고침하거나 prototype/src/ 파일이 빠지지 않았는지 확인해 주세요.';
  box.append('화면을 만드는 파일(src/)을 불러오지 못했어요', small);
  l.setAttribute('role', 'alert'); l.replaceChildren(box);
});
</script>

</body></html>
