function openSignup(app, reason, then) {
  const err = h('div', { class: 'err', role: 'alert' });
  const nick = h('input', { type: 'text', id: 'nick', maxlength: '12', placeholder: '예: 삼청동집사', autocomplete: 'nickname' });
  const age = h('input', { type: 'checkbox', id: 'age14' });
  const terms = h('input', { type: 'checkbox', id: 'terms' });
  const mode = Caps.shared
    ? '이 체험판에서는 지금 로그인한 Claude 계정이 이웃 신분증이 됩니다. 실제 서비스에서는 카카오·네이버·Google·Apple 로그인으로 바뀝니다.'
    : '공유 저장소가 없는 화면이라 이 브라우저 안에서만 기억합니다. 실제 서비스에서는 카카오·네이버·Google·Apple 로그인으로 가입합니다.';
  const submit = h('button', { class: 'btn primary', type: 'submit', text: '이웃 등록하고 계속하기' });
  const form = h('form', { class: 'sheet', novalidate: true },
    h('h3', { text: reason || '고양이에게 손을 내밀려면 이웃 등록이 필요해요' }),
    h('p', { text: `보는 건 누구나 할 수 있어요. ${gatedList()}은(는) 이웃만 할 수 있고, 고양이는 이웃을 기억합니다.` }),
    h('div', { class: 'field' }, h('label', { for: 'nick', text: '골목에서 쓸 이름 (2~12자)' }), nick),
    h('label', { class: 'check', for: 'age14' }, age, h('span', { text: '만 14세 이상입니다.' })),
    h('label', { class: 'check', for: 'terms' }, terms, h('span', { text: '여기 고양이는 가상의 고양이이며, 실제 길고양이 돌봄은 지자체 안내를 따르겠습니다.' })),
    h('div', { class: 'note', text: mode }),
    err,
    h('div', { class: 'foot' }, h('button', { class: 'btn ghost', type: 'button', text: '그냥 구경할게요', onclick: () => close() }), submit),
  );
  const close = openScrim(form);
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const n = nick.value.trim();
    if (n.length < 2) { err.textContent = '이름을 2자 이상 적어 주세요.'; nick.focus(); return; }
    if (!age.checked) { err.textContent = '만 14세 미만은 보호자 동의가 필요해서 지금은 가입할 수 없어요.'; return; }
    if (!terms.checked) { err.textContent = '가상 고양이 안내에 동의해 주세요.'; return; }
    submit.disabled = true; submit.textContent = '등록하는 중…';
    try {
      await Member.join(n, app.dong && app.dong.c);
      close(); toast(`${n}님, 골목 이웃이 되었어요`);
      then && then();
    } catch (ex) {
      submit.disabled = false; submit.textContent = '이웃 등록하고 계속하기';
      err.textContent = ex.message === 'readonly' ? '이 링크는 보기 전용이라 등록할 수 없어요. 편집 권한이 있는 링크로 열어 주세요.' : '등록하지 못했어요. 잠시 뒤 다시 눌러 주세요.';
    }
  });
}
function gatedList() { return Object.keys(GATE).filter((k) => GATE[k] === '회원').map((k) => GATE_LABEL[k]).join(', ') || '일부 기능'; }
// 기능 하나를 실행하기 전 설정표(GATE)를 보고 판단한다. 어드민은 가입 없이 바로 실행.
function requireGate(app, key, reason, fn) {

}

// ── 지역 고르기 (D-05: 시/도 16곳만 활성, 시/군/구·행정동은 "준비 중"으로 보이기만) ──
let SIDO_MAP = null; // 시/도 경계 그림. 속한 동 경계를 한 덩어리로 합쳐 처음 열 때 한 번만 만든다
function buildSidoMap() {
  if (SIDO_MAP) return SIDO_MAP;
  const k = Math.cos(36 * Math.PI / 180), W = 600, H = 560, pad = 12;
  let x0 = 1e9, x1 = -1e9, y0 = 1e9, y1 = -1e9;
  const groups = [];
  for (const s of REGIONS.sidoInfo.values()) {
    const rings = [];
    for (const d of s.dongs) for (const ring of REGIONS.rings(d)) {
      if (ring[0][0] > 130.3) continue; // 울릉도·독도까지 담으면 지도가 너무 넓어져서 그림에서만 뺀다
      const pts = ring.map(([lo, la]) => { const X = lo * k, Y = -la; x0 = Math.min(x0, X); x1 = Math.max(x1, X); y0 = Math.min(y0, Y); y1 = Math.max(y1, Y); return [X, Y]; });
      rings.push(pts);
    }
    groups.push([s, rings]);
  }
  const sc = Math.min((W - pad * 2) / (x1 - x0), (H - pad * 2) / (y1 - y0));
  const ox = (W - (x1 - x0) * sc) / 2, oy = (H - (y1 - y0) * sc) / 2;
  const px = (X) => Math.round(((X - x0) * sc + ox) * 2) / 2, py = (Y) => Math.round(((Y - y0) * sc + oy) * 2) / 2;
  const paths = new Map(), labels = new Map();
  for (const [s, rings] of groups) {
    let dstr = '';
    for (const pts of rings) {
      const seg = []; let last = '';
      for (const [X, Y] of pts) { const key = px(X) + ',' + py(Y); if (key !== last) { seg.push(key); last = key; } }
      if (seg.length >= 3) dstr += 'M' + seg.join('L') + 'Z';
    }
    paths.set(s.c, dstr);
    const lat = s.dongs.reduce((t, d) => t + d.lat, 0) / s.dongs.length, lng = s.dongs.reduce((t, d) => t + d.lng, 0) / s.dongs.length;
    labels.set(s.c, [px(lng * k), py(-lat)]);
  }
  return (SIDO_MAP = { W, H, paths, labels });
}

function openPicker(app) {
  const cur = app.dong;
  const units = REGIONS.units;
  let hot = REGIONS.sidoInfo.get(cur.c.slice(0, 2)) ? cur.c.slice(0, 2) : units[0].c.slice(0, 2);
  const q = h('input', { type: 'text', id: 'dongq', placeholder: '동·구 이름으로 찾기 · 예: 삼청동, 해운대, 성산', autocomplete: 'off' });

  const soonHead = h('div', { class: 'soonhead' });
  const soonList = h('div', { class: 'soonlist', 'aria-label': '준비 중인 시·군·구' });

  };
  const sidoBtn = (u) => {
    const c2 = u.c.slice(0, 2);
    return h('button', { type: 'button', class: u.c === cur.c ? 'on' : '', onclick: () => go(u), onpointerenter: () => setHot(c2), onfocus: () => setHot(c2) },
      h('span', { text: u.n }), h('small', { text: u.c === cur.c ? '지금 여기' : regionFull(u) }));
  };
  const listSidos = () => results.replaceChildren(...units.map(sidoBtn));
  const listSearch = (v) => {
    const nv = v.replace(/\s+/g, ''), out = new Map();
    for (const u of units) if ((u.sido + u.n).replace(/\s+/g, '').includes(nv)) out.set(u.c, h('button', { type: 'button', onclick: () => go(u), onpointerenter: () => setHot(u.c.slice(0, 2)) }, h('span', { text: u.n }), h('small', { text: '이 고양이 보러 가기' })));
    for (const d of REGIONS.search(v)) {
      const u = REGIONS.unitOf(d.c); if (!u || out.has(u.c)) continue;

    }
    results.replaceChildren(...(out.size ? [...out.values()] : [h('div', { class: 'empty', style: 'padding:18px', text: '맞는 곳이 없어요. 두 글자만 적어 보세요.' })]));
  };
  q.addEventListener('input', () => { const v = q.value.trim(); if (v) listSearch(v); else listSidos(); });
  const drawMap = () => {
    const M = buildSidoMap(), NS = 'http://www.w3.org/2000/svg';
    const svg = document.createElementNS(NS, 'svg'); svg.setAttribute('viewBox', `0 0 ${M.W} ${M.H}`); svg.setAttribute('role', 'img'); svg.setAttribute('aria-label', '시·도 지도');
    units.forEach((u, i) => {
      const c2 = u.c.slice(0, 2), path = document.createElementNS(NS, 'path');
      path.setAttribute('d', M.paths.get(c2) || '');
      path.setAttribute('class', 'sido' + (u.c === cur.c ? ' cur' : ''));
      path.setAttribute('style', `--f:hsl(${(i * 137) % 360} 34% 72%)`);
      path.addEventListener('pointerenter', () => { tip.textContent = `${u.n} · 눌러서 이동`; setHot(c2); });
      path.addEventListener('click', () => go(u));
      const t = document.createElementNS(NS, 'title'); t.textContent = u.n; path.append(t);
      svg.append(path);
    });
    for (const u of units) {
      const pos = M.labels.get(u.c.slice(0, 2)); if (!pos) continue;
      const tx = document.createElementNS(NS, 'text'); tx.setAttribute('x', pos[0]); tx.setAttribute('y', pos[1]); tx.setAttribute('class', 'mlabel'); tx.textContent = u.n; svg.append(tx);
    }
    map.replaceChildren(svg, tip);

async function shrinkImage(dataUrl, maxW, maxBytes) {
  const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = dataUrl; });
  const s = Math.min(1, maxW / img.width);
  const c = document.createElement('canvas'); c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
  let q = 0.82, out = c.toDataURL('image/jpeg', q);
  while (out.length > maxBytes && q > 0.4) { q -= 0.1; out = c.toDataURL('image/jpeg', q); }
  return out;
}
